<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크라임씬 ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Special+Elite&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#12141c; --bg2:#1b1f2b; --panel:#222839; --line:#343c55;
  --ink:#eef1f8; --dim:#9aa3bb; --tape:#ffd21f; --red:#e5484d; --green:#3fbf7f; --blue:#4c8dff;
  --paper:#f6efd9; --paperInk:#2b2620;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,1.05vw,22px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.title-font{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.02em}
.en{font-family:'Patrick Hand','Noto Sans KR',cursive;letter-spacing:.01em}
.type{font-family:'Special Elite','Courier New',monospace}

/* police tape */
.tape{background:repeating-linear-gradient(135deg,var(--tape) 0 2.2rem,#111 2.2rem 2.6rem);height:.5rem}
.tape-band{position:relative;background:var(--tape);color:#111;font-family:'Black Han Sans';white-space:nowrap;overflow:hidden;padding:.35rem 0;font-size:1.05rem;letter-spacing:.2em;box-shadow:0 .3rem 1rem #0008}
.tape-band span{display:inline-block;animation:slide 30s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* HOME */
#home{min-height:100vh;display:flex;flex-direction:column}
.hero{text-align:center;padding:2.4rem 1rem 1.2rem;position:relative}
.hero h1{font-family:'Black Han Sans';font-size:4.6rem;margin:0;line-height:1;color:#fff;text-shadow:0 0 2rem #e5484d66,.3rem .3rem 0 #000}
.hero h1 b{color:var(--tape);font-weight:400}
.hero p{color:var(--dim);margin:.6rem 0 0;font-size:1.05rem}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1.4rem 2.4rem 2.4rem;max-width:90rem;margin:0 auto;width:100%}
.ucard{background:linear-gradient(160deg,#262c3e,#1a1e2a);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem 1rem;text-align:left;color:var(--ink);position:relative;overflow:hidden;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:.35rem;min-height:11rem}
.ucard:hover{transform:translateY(-.25rem);border-color:var(--tape)}
.ucard .no{font-family:'Black Han Sans';color:var(--tape);font-size:1rem}
.ucard .ut{font-family:'Patrick Hand';color:var(--dim);font-size:1rem}
.ucard .ct{font-family:'Black Han Sans';font-size:1.45rem;line-height:1.15}
.ucard .cte{font-family:'Special Elite';font-size:.85rem;color:#c9cfdf}
.ucard .row{display:flex;gap:.4rem;margin-top:auto;padding-top:.5rem}
.ucard .row span{font-size:.8rem;padding:.2rem .5rem;border-radius:2rem;background:#ffffff12;color:var(--dim)}
.ucard .stamp{position:absolute;right:-.6rem;top:.7rem;transform:rotate(12deg);font-size:2.6rem;opacity:.9}
.home-foot{display:flex;justify-content:center;gap:.8rem;padding:0 1rem 2rem}
.btn{border:none;border-radius:.7rem;padding:.65rem 1.1rem;font-weight:700;font-size:1rem;background:#2f3650;color:var(--ink);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--tape);color:#111}
.btn.r{background:var(--red);color:#fff}
.btn.g{background:var(--green);color:#06210f}
.btn.b{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.sm{padding:.35rem .7rem;font-size:.85rem}

/* CASE */
#case{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:#0c0e14;border-bottom:1px solid var(--line)}
.topbar .ctitle{font-family:'Black Han Sans';font-size:1.25rem;white-space:nowrap}
.topbar .ctitle small{font-family:'Patrick Hand';color:var(--tape);font-size:1rem;margin-right:.5rem}
.steps{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
.steps button{background:#1d2232;border:1px solid var(--line);color:var(--dim);padding:.35rem .65rem;border-radius:.5rem;font-size:.85rem;font-weight:700}
.steps button.on{background:var(--tape);color:#111;border-color:var(--tape)}
.steps button.done{color:var(--ink)}
.timer{font-family:'Special Elite';font-size:1.3rem;background:#000;border:1px solid #333;padding:.2rem .6rem;border-radius:.4rem;color:#ff6b6b;cursor:pointer;min-width:5.5rem;text-align:center}
.timer.run{color:#7dffb0}
.stage{flex:1;padding:1.2rem 1.6rem 5rem;position:relative}
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:.6rem 1.2rem;background:linear-gradient(0deg,#0c0e14 70%,transparent)}
.navbar .mid{color:var(--dim);font-size:.9rem}
.sec-title{font-family:'Black Han Sans';font-size:2.1rem;margin:.2rem 0 .2rem;display:flex;align-items:center;gap:.6rem}
.sec-title .num{background:var(--tape);color:#111;border-radius:.4rem;padding:0 .5rem;font-size:1.5rem}
.sec-sub{color:var(--dim);margin:0 0 1rem;font-size:1rem}

/* intro */
.intro-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:1.4rem;align-items:start}
.casefile{background:var(--paper);color:var(--paperInk);border-radius:.4rem;padding:1.6rem 1.8rem;position:relative;box-shadow:0 1rem 2.5rem #0009;transform:rotate(-.4deg)}
.casefile:before{content:'CASE FILE';position:absolute;top:-1rem;left:1.4rem;background:#c0392b;color:#fff;font-family:'Special Elite';padding:.15rem .7rem;font-size:.9rem;transform:rotate(-3deg)}
.casefile h2{font-family:'Black Han Sans';font-size:2.4rem;margin:.2rem 0 0;font-weight:400}
.casefile .ten{font-family:'Special Elite';color:#7a6a52;margin-bottom:.8rem}
.casefile p{font-size:1.2rem;line-height:1.75;margin:.6rem 0;opacity:0;transform:translateY(.4rem);transition:all .5s}
.casefile p.show{opacity:1;transform:none}
.casefile .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.casefile .meta span{background:#00000010;border:1px dashed #00000040;border-radius:.3rem;padding:.25rem .55rem;font-size:.95rem}
.side-card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.2rem;margin-bottom:1rem}
.side-card h3{margin:0 0 .6rem;font-size:1.1rem;color:var(--tape)}
.expr{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:1px dashed #ffffff15}
.expr:last-child{border:none}
.expr .e{font-family:'Patrick Hand';font-size:1.45rem;flex:1;line-height:1.2}
.expr .k{color:var(--dim);font-size:.9rem}
.spk{border:none;background:#ffffff14;color:#fff;border-radius:50%;width:2.1rem;height:2.1rem;flex:none;font-size:1rem}
.spk:hover{background:var(--blue)}
.rule-box{background:#3a1d22;border:1px solid #7a2d36;border-radius:1rem;padding:1rem 1.2rem;font-size:1.05rem;line-height:1.6}
.rule-box b{color:#ff8f94}

/* suspects */
.sus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.sus{background:linear-gradient(180deg,#2a3147,#1b1f2c);border:1px solid var(--line);border-radius:1rem;padding:1rem;text-align:center;position:relative;cursor:pointer;transition:transform .15s,border-color .15s}
.sus:hover{transform:translateY(-.2rem);border-color:var(--tape)}
.sus .av{width:72%;margin:0 auto;display:block;aspect-ratio:6/7;background:radial-gradient(circle at 50% 40%,#3b4566,#1d2232 70%);border-radius:50% 50% .8rem .8rem}
.sus .tag{font-family:'Special Elite';font-size:.8rem;color:var(--tape);margin-top:.6rem}
.sus .nm{font-family:'Black Han Sans';font-size:1.7rem;margin:.1rem 0}
.sus .nk{color:var(--dim);font-size:.95rem}
.sus .say{font-family:'Patrick Hand';font-size:1.25rem;background:#fff;color:#222;border-radius:.8rem;padding:.5rem .7rem;margin-top:.7rem;position:relative;line-height:1.25;min-height:3.2rem;display:flex;align-items:center;justify-content:center}
.sus .say:before{content:'';position:absolute;top:-.5rem;left:50%;margin-left:-.5rem;border:.5rem solid transparent;border-top:0;border-bottom-color:#fff}
.sus .kor{color:var(--dim);font-size:.85rem;margin-top:.35rem;min-height:1.2rem}
.sus.accused{border-color:var(--red);box-shadow:0 0 0 .2rem #e5484d55}
.sus .votes{position:absolute;top:.6rem;right:.6rem;background:var(--red);color:#fff;border-radius:2rem;padding:.1rem .6rem;font-weight:900}
.pill{display:inline-block;background:#ffffff14;border-radius:2rem;padding:.25rem .7rem;font-size:.9rem;color:var(--dim);margin:.15rem}
.qcards{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.qcard{background:#fff;color:#222;border-radius:.7rem;padding:.5rem .8rem;display:flex;align-items:center;gap:.5rem;box-shadow:0 .3rem 0 #0005}
.qcard .e{font-family:'Patrick Hand';font-size:1.3rem}
.qcard .k{font-size:.8rem;color:#777}
.qcard .spk{background:#eee;color:#333;width:1.8rem;height:1.8rem;font-size:.85rem}

/* evidence board */
.board{display:grid;grid-template-columns:1fr 18rem;gap:1.2rem}
.turnbar{display:flex;align-items:center;gap:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.turnbar .now{font-family:'Black Han Sans';font-size:1.5rem;color:var(--tape)}
.teamchips{display:flex;gap:.35rem;flex-wrap:wrap}
.teamchips span{padding:.2rem .6rem;border-radius:2rem;font-weight:700;font-size:.85rem;background:#ffffff10;color:var(--dim)}
.teamchips span.on{background:var(--tape);color:#111}
.places{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.place{background:#1d2232;border:1px solid var(--line);border-radius:1rem;overflow:hidden;display:flex;flex-direction:column}
.place .ph{padding:.75rem .9rem;background:linear-gradient(135deg,#323b57,#232a3d);display:flex;align-items:center;gap:.6rem}
.place .ph .ic{font-size:2.1rem}
.place .ph .pn{font-family:'Black Han Sans';font-size:1.25rem;line-height:1.1}
.place .ph .pe{font-family:'Special Elite';font-size:.75rem;color:var(--dim)}
.place .pd{font-size:.85rem;color:var(--dim);padding:.5rem .9rem 0;min-height:2.6rem}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.7rem .9rem .9rem}
.ev{aspect-ratio:1/0.8;border-radius:.6rem;border:2px dashed #4b5574;background:#151926;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-weight:700;padding:.3rem;text-align:center;transition:all .15s;position:relative}
.ev:hover{border-color:var(--tape);color:var(--tape)}
.ev .q{font-family:'Black Han Sans';font-size:1.7rem}
.ev .n{font-size:.7rem;opacity:.8}
.ev.open{border-style:solid;border-color:#8a7b54;background:var(--paper);color:var(--paperInk)}
.ev.open .q{font-size:1.5rem}
.ev.open .n{font-size:.72rem;opacity:1;line-height:1.15}
.ev .who{position:absolute;top:.15rem;right:.25rem;font-size:.62rem;background:#0006;color:#fff;border-radius:.3rem;padding:0 .25rem}
.ev.lockd:after{content:'🔒';position:absolute;bottom:.15rem;right:.25rem;font-size:.8rem}
.bagrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-top:.9rem}
.bag{background:#1d2232;border:1px solid var(--line);border-radius:1rem;padding:.6rem .8rem;display:flex;gap:.6rem;align-items:center}
.bag svg{width:3.6rem;flex:none}
.bag .bn{font-family:'Black Han Sans';font-size:1.05rem}
.bag .bs{font-size:.75rem;color:var(--dim)}
.bag .evs{padding:0;grid-template-columns:repeat(2,1fr);flex:1}
.bag .ev{aspect-ratio:auto;min-height:3.4rem}
.notebook{background:var(--paper);color:var(--paperInk);border-radius:.6rem;padding:1rem;position:sticky;top:1rem;max-height:calc(100vh - 8rem);overflow:auto;background-image:repeating-linear-gradient(0deg,transparent 0 1.55rem,#c9b98f55 1.55rem 1.6rem)}
.notebook h3{font-family:'Black Han Sans';margin:0 0 .3rem;font-weight:400;font-size:1.3rem}
.notebook .cnt{font-family:'Special Elite';font-size:.85rem;color:#7a6a52;margin-bottom:.5rem}
.notebook ol{margin:0;padding-left:1.3rem}
.notebook li{font-size:.9rem;line-height:1.6rem;cursor:pointer}
.notebook li:hover{text-decoration:underline}
.notebook li small{color:#8a7a62}

/* modal */
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:2rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:1.2rem;max-width:68rem;width:100%;max-height:92vh;overflow:auto;padding:1.4rem 1.6rem;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox .x{position:absolute;top:.7rem;right:.8rem;background:#ffffff14;border:none;color:#fff;border-radius:50%;width:2.4rem;height:2.4rem;font-size:1.2rem}
.evhead{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem}
.evhead .tg{background:#c0392b;color:#fff;font-family:'Special Elite';padding:.1rem .6rem;border-radius:.3rem}
.evhead h2{margin:0;font-family:'Black Han Sans';font-weight:400;font-size:1.9rem}
.evhead .wh{color:var(--dim)}
.evbody{display:flex;justify-content:center;padding:.5rem 0 1rem}
.evtools{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--line);padding-top:.9rem}
.words{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.8rem}
.words span{background:#ffffff10;border-radius:.4rem;padding:.25rem .6rem;font-size:.95rem}
.words span b{font-family:'Patrick Hand';font-size:1.15rem;color:var(--tape);margin-right:.3rem;font-weight:400}
.kotrans{margin-top:.8rem;background:#ffffff0a;border-left:.25rem solid var(--tape);padding:.7rem 1rem;border-radius:.3rem;font-size:1.05rem;line-height:1.7;white-space:pre-line}

/* evidence renderers */
.paper{background:var(--paper);color:var(--paperInk);padding:1.4rem 1.8rem;border-radius:.3rem;box-shadow:0 .8rem 2rem #0008;max-width:46rem;width:100%;position:relative}
.paper.note{background:#fff8b8;transform:rotate(-1deg);font-family:'Patrick Hand';font-size:1.9rem;line-height:1.35;white-space:pre-line}
.paper.note:before{content:'';position:absolute;top:-.8rem;left:50%;width:6rem;margin-left:-3rem;height:1.6rem;background:#ffffff88;transform:rotate(2deg)}
.paper.note .from{display:block;text-align:right;font-size:1.4rem;color:#6b5f3a;margin-top:.5rem}
.paper.sign{background:#fff;border:.5rem solid #2c3e50;text-align:center;font-family:'Noto Sans KR';color:#1d2b38}
.paper.sign .sh{font-family:'Black Han Sans';font-size:2.2rem;margin-bottom:.4rem;font-weight:400}
.paper.sign .sb{font-family:'Patrick Hand';font-size:1.75rem;line-height:1.35;white-space:pre-line}
.paper.poster{background:linear-gradient(160deg,#ff9a8b,#ffd36e);text-align:center;border-radius:.6rem}
.paper.poster .sh{font-family:'Black Han Sans';font-size:2.6rem;color:#3a1a00;font-weight:400}
.paper.poster .sb{font-family:'Patrick Hand';font-size:1.8rem;line-height:1.35;white-space:pre-line;color:#3a1a00}
.paper.diary{background:#fdfdfd;background-image:repeating-linear-gradient(0deg,transparent 0 2.4rem,#9ec3ff 2.4rem 2.48rem);font-family:'Patrick Hand';font-size:1.75rem;line-height:2.48rem;padding-top:1rem;border-left:.5rem solid #ff9aa2;white-space:pre-line}
.paper.diary .dd{font-family:'Special Elite';font-size:1rem;color:#888}
.paper.letter{font-family:'Patrick Hand';font-size:1.7rem;line-height:1.45;white-space:pre-line}
.paper.table{background:#fff;font-family:'Noto Sans KR'}
.paper.table .sh{font-family:'Black Han Sans';font-size:1.7rem;margin-bottom:.6rem;font-weight:400;text-align:center}
.paper.table table{width:100%;border-collapse:collapse;font-size:1.25rem}
.paper.table th{background:#2c3e50;color:#fff;padding:.4rem .5rem;font-weight:700}
.paper.table td{border:1px solid #ccd;padding:.4rem .6rem;font-family:'Patrick Hand';font-size:1.5rem;text-align:center}
.paper.table tr.hl td{background:#fff3b0}
.paper.table .foot{font-family:'Patrick Hand';font-size:1.3rem;margin-top:.6rem;color:#555;white-space:pre-line}
.phone{width:22rem;background:#111;border-radius:2rem;padding:1rem .8rem 1.4rem;box-shadow:0 1rem 2rem #000a}
.phone .pt{color:#fff;text-align:center;font-weight:700;padding-bottom:.6rem;border-bottom:1px solid #333;margin-bottom:.6rem}
.phone .scr{background:#b2c7d9;border-radius:1rem;padding:.8rem .6rem;display:flex;flex-direction:column;gap:.45rem;min-height:14rem}
.bub{max-width:82%;padding:.45rem .7rem;border-radius:1rem;font-family:'Patrick Hand';font-size:1.35rem;line-height:1.25;background:#fff;color:#222;align-self:flex-start}
.bub.me{background:#ffe94a;align-self:flex-end}
.bub .s{display:block;font-family:'Noto Sans KR';font-size:.7rem;color:#666;margin-bottom:.1rem}
.photo{background:#fff;padding:1rem 1rem 1.4rem;box-shadow:0 .8rem 2rem #000a;transform:rotate(1deg);max-width:44rem}
.photo .pic{background:#cfd8e3;min-height:14rem;display:flex;align-items:flex-end;justify-content:center;gap:1rem;padding:1rem;border-radius:.2rem;position:relative;overflow:hidden}
.photo .pic.cctv{background:#3b4a3b;filter:grayscale(.6) contrast(1.1)}
.photo .pic.cctv:after{content:'● REC';position:absolute;top:.5rem;left:.7rem;color:#ff4040;font-family:'Special Elite'}
.photo .pic .big{font-size:7rem;line-height:1}
.photo .pic svg{width:9rem}
.photo .pic .ts{position:absolute;bottom:.4rem;right:.6rem;font-family:'Special Elite';color:#ffef6b;font-size:1rem}
.photo .cap{font-family:'Patrick Hand';font-size:1.6rem;color:#333;text-align:center;margin-top:.7rem;line-height:1.3;white-space:pre-line}
.item{text-align:center;max-width:44rem}
.item .big{font-size:8rem;line-height:1.1;filter:drop-shadow(0 .6rem 1rem #000a)}
.item .desc{background:#fff;color:#222;font-family:'Patrick Hand';font-size:1.75rem;line-height:1.35;border-radius:.8rem;padding:.9rem 1.2rem;margin-top:.8rem;white-space:pre-line}
.cal{background:#fff;color:#222;border-radius:.6rem;overflow:hidden;width:50rem;box-shadow:0 .8rem 2rem #000a}
.cal .ch{background:#c0392b;color:#fff;text-align:center;font-family:'Black Han Sans';font-size:1.8rem;padding:.4rem}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .cg div{border:1px solid #eee;min-height:4.6rem;padding:.25rem;font-size:1.1rem;position:relative}
.cal .cg div.dw{min-height:auto;background:#f4f4f4;text-align:center;font-weight:700}
.cal .cg div i{font-style:normal;font-family:'Patrick Hand';font-size:1.25rem;color:#c0392b;display:block;line-height:1.05;margin-top:.1rem}
.cal .cg div.mk{background:#fff3b0}
.cal .foot{font-family:'Patrick Hand';font-size:1.7rem;padding:.4rem .8rem;white-space:pre-line}
.lockbox{text-align:center;max-width:40rem}
.lockbox .big{font-size:6rem}
.lockbox .lp{font-family:'Patrick Hand';font-size:1.8rem;background:#fff;color:#222;border-radius:.8rem;padding:.8rem 1.2rem;line-height:1.35;white-space:pre-line}
.lockbox input{font-family:'Special Elite';font-size:2rem;text-align:center;width:14rem;padding:.4rem;border-radius:.5rem;border:3px solid var(--tape);background:#000;color:var(--tape);margin:1rem .5rem 0;text-transform:uppercase}
.lockbox .wrong{color:#ff7b7b;margin-top:.5rem;min-height:1.5rem}
.mapg{display:grid;gap:.25rem;background:#9aa;padding:.4rem;border-radius:.6rem;box-shadow:0 .8rem 2rem #000a}
.mapg div{background:#e8f1e0;border-radius:.3rem;min-width:9rem;min-height:6.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Patrick Hand';font-size:1.55rem;color:#222;text-align:center;line-height:1.1}
.mapg div b{font-size:2.6rem;font-weight:400}
.mapg div.road{background:#6b7280;color:#fff;font-size:.95rem}
.mapg div.empty{background:#b9c9ad}
.mapcap{font-family:'Patrick Hand';font-size:1.8rem;text-align:center;margin-top:.6rem;white-space:pre-line}

/* lie detector */
.ld-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:1.2rem}
.machine{background:radial-gradient(circle at 50% 30%,#2c3550,#141826);border:2px solid #3a4566;border-radius:1.4rem;padding:1.2rem;text-align:center;position:relative}
.gauge{width:100%;max-width:26rem}
.ld-result{font-family:'Black Han Sans';font-size:4rem;height:5rem;margin-top:.2rem}
.ld-result.t{color:var(--green);text-shadow:0 0 2rem #3fbf7f}
.ld-result.f{color:var(--red);text-shadow:0 0 2rem #e5484d}
.ld-pick{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.ld-pick button{border:2px solid var(--line);background:#1d2232;color:var(--ink);border-radius:.8rem;padding:.3rem .6rem;display:flex;align-items:center;gap:.4rem;font-weight:700}
.ld-pick button svg{width:2.4rem}
.ld-pick button.on{border-color:var(--tape);background:#3a3520}
.ans{display:flex;gap:.8rem;justify-content:center;margin:.6rem 0}
.ans button{font-family:'Black Han Sans';font-size:1.6rem;padding:.4rem 1.6rem;border-radius:.8rem;border:none}
.secret{margin-top:.8rem;opacity:.35;transition:opacity .2s;font-size:.85rem}
.secret:hover{opacity:1}
.ld-log{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1rem;max-height:60vh;overflow:auto}
.ld-log table{width:100%;border-collapse:collapse;font-size:.95rem}
.ld-log td,.ld-log th{border-bottom:1px solid #ffffff15;padding:.35rem .3rem;text-align:left}
.lamp{display:inline-block;width:1rem;height:1rem;border-radius:50%;background:#333;margin:0 .2rem;vertical-align:middle}
.lamp.on.t{background:var(--green);box-shadow:0 0 .8rem var(--green)}
.lamp.on.f{background:var(--red);box-shadow:0 0 .8rem var(--red)}

/* vote */
.vote-teams{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.vote-teams button{border:2px solid var(--line);background:#1d2232;color:var(--ink);border-radius:.7rem;padding:.4rem .8rem;font-weight:700}
.vote-teams button.on{border-color:var(--tape);background:#3a3520}
.vote-teams button .ch{color:var(--tape);margin-left:.3rem}

/* reveal */
.reveal{display:grid;grid-template-columns:22rem 1fr;gap:1.6rem;align-items:start}
.culprit-card{background:linear-gradient(180deg,#3d1b20,#1b1015);border:2px solid var(--red);border-radius:1.2rem;padding:1.2rem;text-align:center;position:relative;overflow:hidden}
.culprit-card .stampc{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg) scale(3);opacity:0;font-family:'Black Han Sans';font-size:3rem;color:var(--red);border:.35rem solid var(--red);padding:0 .8rem;border-radius:.5rem;background:#ffffffd0;transition:all .45s cubic-bezier(.2,1.6,.4,1)}
.culprit-card.go .stampc{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}
.culprit-card svg{width:80%}
.culprit-card .nm{font-family:'Black Han Sans';font-size:2.4rem}
.drum{display:flex;justify-content:center;gap:1rem;margin:2rem 0}
.drum .sus{width:14rem;pointer-events:none}
.drum .sus.hl{border-color:var(--red);transform:scale(1.06);box-shadow:0 0 2rem #e5484d88}
.story p{font-size:1.15rem;line-height:1.8;margin:.2rem 0 .8rem}
.keyev{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.keyev .k{background:var(--panel);border:1px solid var(--line);border-left:.35rem solid var(--tape);border-radius:.6rem;padding:.7rem .9rem;cursor:pointer}
.keyev .k b{display:block;color:var(--tape);margin-bottom:.2rem}
.keyev .k span{font-size:.95rem;line-height:1.55;color:#d7dbe6}
.score{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}
.score span{padding:.3rem .7rem;border-radius:.5rem;font-weight:700}
.score .ok{background:#1f4d36;color:#8ff0bd}
.score .no{background:#4a1f25;color:#ff9da2}

.pinbox{text-align:center;max-width:24rem;margin:0 auto}
.pinbox input{font-size:2rem;text-align:center;letter-spacing:.2rem;width:16rem;padding:.4rem;border-radius:.6rem;border:2px solid var(--line);background:#000;color:#fff;margin:1rem 0}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;color:#111}
  #home,#case,.modal{display:none!important}
  #print{display:block!important}
}
.pcard{page-break-after:always;font-family:'Noto Sans KR';color:#222;border:3px solid #34495e;border-radius:4mm;padding:7mm 8mm;height:274mm;overflow:hidden;position:relative}
.pcard.culp{border-color:#c0392b}
.pcard:last-child{page-break-after:auto}
.pcard .ph{display:flex;align-items:center;gap:5mm;border-bottom:2px solid #34495e;padding-bottom:3mm;margin-bottom:3mm}
.pcard .ph h1{font-family:'Black Han Sans';font-weight:400;font-size:24pt;margin:0}
.pcard .ph .who{font-size:12pt;margin-left:auto;padding:2mm 4mm;border-radius:2mm;font-weight:900;background:#eaf2fb;color:#2c3e50}
.pcard.culp .ph .who{background:#c0392b;color:#fff}
.pcard .top{display:flex;gap:5mm}
.pcard .top svg{width:34mm;flex:none}
.pcard .prof{flex:1;font-size:10.5pt;line-height:1.6}
.pcard h2{font-size:12pt;margin:4mm 0 1.5mm;background:#eef2f7;padding:1mm 3mm;border-left:4px solid #34495e}
.pcard.culp h2{border-color:#c0392b;background:#fbeeee}
.pcard .say{font-family:'Patrick Hand';font-size:14pt;line-height:1.25;border:1.5px dashed #888;border-radius:2mm;padding:1.5mm 3mm;margin:1mm 0}
.pcard .say small{display:block;font-family:'Noto Sans KR';font-size:9pt;color:#666}
.pcard ul{margin:1mm 0;padding-left:5mm;font-size:10pt;line-height:1.6}
.pcard .foot{position:absolute;left:0;right:0;bottom:0;background:#34495e;color:#fff;text-align:center;padding:2mm;font-size:10.5pt;border-radius:0 0 2mm 2mm}
.pcard.culp .foot{background:#c0392b}
.pcard .two{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.pcard table{width:100%;border-collapse:collapse;font-size:10pt}
.pcard td,.pcard th{border:1px solid #999;padding:2mm;vertical-align:top}
.pcard th{background:#eef2f7}
.pcard .wline{height:8mm}
@media print{ #tab{display:none!important} }
.roomchip{background:#13304f;border:1px solid #2f6fb0;color:#cfe6ff;border-radius:.5rem;padding:.25rem .6rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.roomchip b{color:var(--tape);font-family:'Special Elite';font-size:1.1rem;letter-spacing:.1em}
.live{font-size:.85rem;color:#ffb36b}
.live.on{color:#7dffb0}
.pickmode{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pickmode button{background:#262c3e;border:2px solid var(--line);border-radius:1rem;padding:1.2rem;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:.5rem}
.pickmode button:hover{border-color:var(--tape)}
.pickmode b{font-family:'Black Han Sans';font-weight:400;font-size:1.6rem}
.pickmode span{color:var(--dim);line-height:1.5}
.setrow{display:flex;align-items:center;gap:1rem;margin:.7rem 0;flex-wrap:wrap}
.setrow label{width:11rem;color:var(--tape);font-weight:700}
.opt{background:#1d2232;border:2px solid var(--line);color:var(--ink);border-radius:.6rem;padding:.4rem .8rem;margin:.15rem;font-weight:700}
.opt.on{background:var(--tape);color:#111;border-color:var(--tape)}
.bigcode{font-family:'Special Elite',monospace;font-size:7rem;letter-spacing:1.2rem;color:var(--tape);text-shadow:0 0 2rem #ffd21f55;margin:.6rem 0}
.joinbar{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.joinbar span{padding:.3rem .7rem;border-radius:2rem;background:#ffffff10;color:var(--dim);font-weight:700}
.joinbar span.on{background:#1f4d36;color:#8ff0bd}
.gboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.9rem}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.9rem 1rem}
.gcard.off{opacity:.5}
.gh{display:flex;justify-content:space-between;align-items:center}
.gh b{font-family:'Black Han Sans';font-weight:400;font-size:1.5rem;color:var(--tape)}
.gh span{color:var(--dim)}
.gbar{height:.45rem;background:#ffffff12;border-radius:1rem;margin:.5rem 0;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--tape)}
.glist{display:flex;flex-direction:column;gap:.3rem}
.glist button{background:#1a1f2d;border:1px solid #333c56;color:var(--ink);text-align:left;border-radius:.5rem;padding:.35rem .6rem;font-size:.95rem}
.glist button:hover{border-color:var(--tape)}
.glist .none{color:var(--dim);font-size:.9rem}
.glist.big button{font-size:1.1rem;padding:.6rem .8rem}
.why{padding:.5rem .7rem;border-radius:.5rem;margin:.3rem 0;background:#ffffff08}
.why.ok{border-left:.3rem solid var(--green)} .why.no{border-left:.3rem solid var(--red)}
.why .en{font-size:1.25rem;margin-left:.4rem}
.present-banner{background:var(--tape);color:#111;font-family:'Black Han Sans';font-size:1.5rem;padding:.4rem .9rem;border-radius:.6rem;margin:0 3rem .8rem 0}
.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:#111;border:2px solid var(--tape);color:#fff;padding:.7rem 1.2rem;border-radius:2rem;z-index:99;font-weight:700;animation:fade .2s}
/* tablet */
#tab{min-height:100vh;padding-bottom:4rem;font-size:16px}
#tab .btn{font-size:1rem}
.tabhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem;background:#0c0e14;border-bottom:3px solid var(--tape);flex-wrap:wrap}
.tabhead .tg{background:var(--tape);color:#111;font-family:'Black Han Sans';font-size:1.7rem;padding:.1rem .7rem;border-radius:.5rem}
.tabhead .tt{font-family:'Black Han Sans';font-size:1.25rem;line-height:1.15;flex:1;min-width:10rem}
.tabhead .tt small{display:block;font-family:'Noto Sans KR';font-size:.75rem;color:var(--dim)}
.tabhead .ts{background:#1d2232;border:1px solid var(--line);padding:.3rem .7rem;border-radius:.5rem;font-weight:700}
.tabbody{padding:1rem;max-width:70rem;margin:0 auto}
.tabfoot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:.4rem .9rem;background:#0c0e14ee}
.tvsign{background:linear-gradient(90deg,#3a1d22,#22283a);border:1px solid #7a2d36;border-radius:1rem;padding:1rem 1.2rem;font-size:1.25rem;font-weight:700;margin-bottom:1rem}
.th{color:var(--tape);margin:1.2rem 0 .5rem;font-size:1.1rem}
.tcards{display:flex;flex-wrap:wrap;gap:.5rem}
.tcards .qcard .e{font-size:1.25rem}
.tsus{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.7rem}
.tsc{background:linear-gradient(180deg,#2a3147,#1b1f2c);border:2px solid var(--line);border-radius:1rem;padding:.7rem;text-align:center;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:.15rem}
.tsc svg{width:70%}
.tsc b{font-family:'Black Han Sans';font-weight:400;font-size:1.4rem}
.tsc small{color:var(--dim)}
.tsc .en{font-size:1.15rem;line-height:1.2;margin-top:.3rem}
.tsc.on{border-color:var(--red);box-shadow:0 0 0 .2rem #e5484d66;background:linear-gradient(180deg,#4a1f25,#1b1015)}
.tnote{display:grid;gap:.6rem;margin-top:1rem}
.tnote label{display:flex;gap:.7rem;align-items:center;background:var(--panel);border-radius:.8rem;padding:.5rem .7rem}
.tnote label span{display:flex;flex-direction:column;align-items:center;width:5rem;flex:none}
.tnote label svg{width:3.4rem}
.tnote textarea,.twhy textarea{flex:1;min-height:3.4rem;background:#fff;color:#222;border-radius:.6rem;border:none;padding:.5rem .7rem;font-family:'Patrick Hand','Noto Sans KR';font-size:1.3rem;resize:vertical;width:100%}
.tleft{font-size:1.3rem;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;margin-bottom:.8rem}
.tleft b{color:var(--tape);font-size:1.8rem;font-family:'Black Han Sans';font-weight:400}
.tleft.zero b{color:var(--red)}
.tplaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.tbags{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.tbags .bag .ev{aspect-ratio:auto;min-height:3.6rem}
.ev.dead{opacity:.35}
.tip{color:var(--dim);margin-top:1rem;line-height:1.6}
.tlog div{background:var(--panel);border-radius:.6rem;padding:.5rem .8rem;margin:.3rem 0}
.twhy{background:var(--panel);border-radius:1rem;padding:1rem;margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}
.twhy .en{font-size:1.5rem}
.twhy .en b{color:var(--tape)}
.tres{font-family:'Black Han Sans';font-size:2rem;text-align:center;padding:1rem;border-radius:1rem;margin-bottom:1rem}
.tres.ok{background:#1f4d36;color:#8ff0bd} .tres.no{background:#4a1f25;color:#ff9da2}
.pickable .tsc{cursor:pointer}
@media (max-width:700px){ .pickmode{grid-template-columns:1fr} .mbox{padding:1rem} .paper.note,.paper.diary{font-size:1.4rem} }
.tplaces .ev{aspect-ratio:auto;min-height:5.2rem}
.landing{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;max-width:56rem;margin:2rem auto;padding:0 1.5rem;width:100%}
.lbtn{background:linear-gradient(160deg,#262c3e,#1a1e2a);border:2px solid var(--line);border-radius:1.4rem;padding:2.2rem 1.4rem;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:.6rem;transition:transform .15s,border-color .15s}
.lbtn:hover{transform:translateY(-.3rem);border-color:var(--tape)}
.lbtn .li{font-size:4.5rem;line-height:1}
.lbtn b{font-family:'Black Han Sans';font-weight:400;font-size:2.4rem}
.lbtn small{color:var(--dim);font-size:1.05rem}
.lbtn.stu{border-color:#2f6fb0}
.lbtn.tea{border-color:#7a6a2a}
.help{line-height:1.7;font-size:1.02rem}
.hsec{margin-bottom:1.1rem}
.hsec h3{color:var(--tape);margin:.2rem 0 .4rem;font-size:1.2rem}
.hsec ol,.hsec ul{margin:.2rem 0;padding-left:1.4rem}
.hmode{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.5rem}
.hmode div{background:#ffffff0a;border:1px solid var(--line);border-radius:.8rem;padding:.7rem .9rem}
.hmode .ht{display:block;font-size:1.1rem;margin-bottom:.2rem}
.htable{width:100%;border-collapse:collapse;font-size:.95rem}
.htable th{background:#2f3650;padding:.4rem;text-align:left}
.htable td{border-bottom:1px solid #ffffff15;padding:.45rem .4rem;vertical-align:top}
.htable td:first-child{white-space:nowrap;font-weight:700;color:var(--tape)}
@media (max-width:700px){ .landing,.hmode{grid-template-columns:1fr} .lbtn{padding:1.4rem} }
.joingroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.5rem;margin-top:1rem;text-align:left}
.jg{background:#ffffff0a;border:1px solid var(--line);border-radius:.7rem;padding:.5rem .7rem}
.jg b{color:var(--tape)} .jg span{float:right;color:var(--dim)}
.jg div{margin-top:.3rem;display:flex;flex-wrap:wrap;gap:.25rem}
.jg i{font-style:normal;background:#1f4d36;color:#8ff0bd;border-radius:1rem;padding:0 .5rem;font-size:.85rem}
.jg em{color:var(--dim)}
.jrow{display:flex;align-items:center;gap:.6rem;margin:.5rem 0}
.jrow label{width:4.5rem;text-align:right;color:var(--dim)}
.jrow input,.jrow select{flex:1;font-size:1.4rem;padding:.4rem .6rem;border-radius:.6rem;border:2px solid var(--line);background:#000;color:#fff;margin:0;width:auto;letter-spacing:normal;text-align:left}
.solvehead{display:flex;align-items:center;gap:1.4rem;background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1.2rem;margin-bottom:1rem;flex-wrap:wrap}
.bigclock{font-family:'Special Elite',monospace;font-size:4rem;color:#7dffb0;background:#000;border-radius:.8rem;padding:.1rem 1rem;line-height:1.1}
.bigclock[data-st=wait],.bigclock[data-st=paused]{color:#ffd21f}
.bigclock[data-st=ended]{color:#ff6b6b}
.solvehead .ctl{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.evwrap{display:grid;grid-template-columns:1fr 17rem;gap:1rem;align-items:start}
.gcred{font-size:1.05rem;margin:.3rem 0}
.gcred b{color:var(--tape);font-size:1.6rem;font-family:'Black Han Sans';font-weight:400}
.gcred small{color:var(--dim)}
.gmem{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.5rem}
.gmem i{font-style:normal;background:#ffffff10;border-radius:1rem;padding:0 .5rem;font-size:.8rem;color:#cfd6e6}
.rank{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px dashed #ffffff15}
.rank b{background:var(--tape);color:#111;border-radius:50%;width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center}
.rank small{color:var(--dim)} .rank span{margin-left:auto;font-weight:700}
.tabbody.wide{max-width:96rem}
.solvebar{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:.8rem}
.solvebar>div{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.4rem .7rem;text-align:center}
.solvebar small{display:block;color:var(--dim);font-size:.8rem}
.solvebar b{font-family:'Black Han Sans';font-weight:400;font-size:1.7rem;color:var(--tape)}
.solvebar .sb-clock b{font-family:'Special Elite';color:#7dffb0}
.panes{display:none;gap:.5rem;margin-bottom:.7rem}
.panes button{flex:1;background:#1d2232;border:2px solid var(--line);color:var(--ink);border-radius:.7rem;padding:.6rem;font-weight:700;font-size:1.05rem}
.panes button.on{background:var(--tape);color:#111;border-color:var(--tape)}
.solvegrid{display:grid;grid-template-columns:minmax(22rem,1fr) 1.3fr;gap:1rem;align-items:start}
.quizbox{position:sticky;top:5rem}
.qwait{background:var(--panel);border:2px dashed var(--line);border-radius:1rem;padding:2rem 1rem;text-align:center;font-size:1.15rem;line-height:1.7;color:var(--dim);display:flex;flex-direction:column;align-items:center}
.qwait b{display:block;color:var(--ink);font-size:1.4rem;margin:.4rem 0}
.qwait{font-size:1.1rem}
.qcardx{background:linear-gradient(180deg,#fdf8e8,#f3ead0);color:#2b2620;border-radius:1.2rem;padding:1.1rem 1.2rem;box-shadow:0 .6rem 1.6rem #0008}
.qtop{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem}
.qtype{background:#2c3e50;color:#fff;border-radius:.4rem;padding:.1rem .6rem;font-weight:700;font-size:.9rem}
.qpts{background:#c0392b;color:#fff;border-radius:.4rem;padding:.1rem .5rem;font-weight:900;font-size:.9rem}
.qstreak{margin-left:auto;color:#d35400;font-weight:900}
.qpre{background:#fff;border-radius:.6rem;padding:.6rem .8rem;font-size:1.3rem;line-height:1.35;margin-bottom:.5rem}
.qp{font-size:1.75rem;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.qp.en{font-family:'Patrick Hand';font-weight:400;font-size:2.1rem}
.qp .spk{background:#2c3e50}
.qsub{color:#7a6a52;margin:.3rem 0 .8rem}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.qopts button{background:#fff;border:2px solid #d8cba5;border-radius:.8rem;padding:.7rem .6rem;font-size:1.1rem;font-weight:700;color:#2b2620;min-height:3.6rem;line-height:1.25}
.qopts button.en{font-family:'Patrick Hand';font-weight:400;font-size:1.45rem}
.qopts button:active{transform:scale(.97)}
.qopts button.right,.qchips button.right{background:#3fbf7f;border-color:#2a8f5c;color:#fff}
.qopts button.wrong{background:#e5484d;border-color:#b02a2f;color:#fff}
.qbuilt{min-height:3.4rem;background:#fff;border:2px dashed #c9b98f;border-radius:.8rem;padding:.4rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:1.4rem}
.qbuilt span{color:#aaa;font-family:'Noto Sans KR';font-size:.9rem}
.qbuilt button{background:#2c3e50;color:#fff;border:none;border-radius:.5rem;padding:.2rem .6rem;font-family:'Patrick Hand';font-size:1.45rem}
.qchips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.qchips button{background:#fff;border:2px solid #d8cba5;border-radius:.6rem;padding:.3rem .7rem;font-size:1.5rem;color:#2b2620}
.qchips button.used{opacity:.25}
.qact{display:flex;gap:.5rem;justify-content:flex-end}
.qact .btn[disabled]{opacity:.4}
.qfb{margin-top:.7rem;min-height:1.6rem;font-weight:900;font-size:1.15rem;text-align:center}
.qfb.ok{color:#1f8a52} .qfb.no{color:#c0392b}
.qfb .en{font-size:1.4rem}
.tsub{background:var(--panel);border-radius:.8rem;padding:.6rem .9rem;margin-bottom:.8rem}
.tsub .en{font-size:1.25rem;margin-left:.3rem}
@media (max-width:900px){
  .panes{display:flex}
  .solvegrid{grid-template-columns:1fr}
  .solvegrid[data-pane=quiz] #boardBox{display:none}
  .solvegrid[data-pane=board] #quizBox{display:none}
  .quizbox{position:static}
  .solvebar{grid-template-columns:repeat(2,1fr)}
  .evwrap{grid-template-columns:1fr}
}
.ptable{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.4rem}
.ptable th{color:var(--dim);font-weight:400;text-align:left;border-bottom:1px solid #ffffff20;padding:.2rem}
.ptable td{padding:.25rem .2rem;border-bottom:1px dashed #ffffff10}
.ptable td:not(:first-child),.ptable th:not(:first-child){text-align:center}
.gresw{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
.gres{background:#ffffff06;border-radius:.6rem;padding:.5rem .6rem}
.gres>b{color:var(--tape)}
.tabhead .tg{font-size:1.3rem}

/* ================= C안 테마 ================= */
:root{
  --bg:#0a0e16; --bg2:#121a28; --panel:#141c2b; --line:#2e3c55;
  --gold:#c9a35a; --gold2:#e0b545; --red:#8e1c1c; --red2:#b02626;
  --parch:#eadbb9; --parch2:#dcc79c; --pink:#2a2018;
  --tape:#e7b43a;
}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif}
.title-font,.sec-title,.ucard .ct,.sus .nm,.casefile h2,.place .ph .pn,.notebook h3,.evhead h2{font-family:'Noto Sans KR',sans-serif!important;font-weight:900!important}
.en{font-family:'Noto Sans KR',sans-serif}

/* 공통 패널 */
.frame{border:3px solid #39465f;box-shadow:0 0 0 1px #0a0e16,0 0 0 3px #7d6a3f,0 .8rem 2rem #0009;border-radius:.8rem}
.btn{background:#1c2638;border:1px solid #3a4a66;color:#e8ecf4;border-radius:.45rem}
.btn.y{background:linear-gradient(180deg,#e9bd4c,#c99a24);color:#2a1d00;border-color:#f3d27a}
.btn.r{background:linear-gradient(180deg,#a82424,#7d1717);color:#fff;border-color:#c9a35a}
.btn.g{background:linear-gradient(180deg,#2f8f5a,#1f6b42);color:#fff;border-color:#59c08a}
.btn.b{background:linear-gradient(180deg,#2c4f8f,#1d3768);color:#fff;border-color:#5b83c9}
.btn.ghost{background:#141c2b;border:1px solid #3a4a66;color:#c3cbd9}

/* 첫 화면 */
body.at-landing #home .hero, body.at-landing #home .tape-band{display:none}
#home{background:#05070b}
.landing2{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:0}
.stage169{position:relative;width:min(100vw,calc(100vh * var(--ar)));aspect-ratio:var(--ar);margin:0 auto}
.stage169>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.stage169 .hot{position:absolute;background:transparent;border:0;border-radius:1rem;cursor:pointer;transition:background .15s,box-shadow .15s}
.stage169 .hot:hover{background:#ffffff14;box-shadow:0 0 2rem #ffd36a55}
.stage169 .hot:active{background:#ffffff24}
#home .hero{padding:1.2rem 1rem .4rem}
.logo-big{height:7.5rem;filter:drop-shadow(0 .4rem 1rem #000)}
#home .hero p{margin-top:.2rem}
#teacherHome{background:linear-gradient(#0a0e16cc,#0a0e16ee),url('assets/ui/landing_blur.webp') center/cover fixed;min-height:calc(100vh - 11rem)}

/* 단원 카드 */
.ucard2{background:#141c2b;border:2px solid #3a4660;border-radius:.8rem;padding:0;overflow:hidden;text-align:left;color:#eef1f8;display:flex;flex-direction:column;box-shadow:0 0 0 2px #0a0e16,0 .5rem 1.2rem #0008;transition:transform .15s,border-color .15s}
.ucard2:hover{transform:translateY(-.25rem);border-color:var(--gold2)}
.ucard2 .uimg{aspect-ratio:16/9;background-size:cover;background-position:center}
.ucard2 .ubody{padding:.6rem .8rem .7rem}
.ucard2 .ul{display:flex;gap:.5rem;align-items:baseline}
.ucard2 .ul b{color:var(--gold2);font-size:.95rem}
.ucard2 .ul span{color:#9aa3bb;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard2 .ut2{font-weight:900;font-size:1.25rem;margin:.15rem 0 .3rem}
.ucard2 .row{display:flex;gap:.35rem;flex-wrap:wrap}
.ucard2 .row span{font-size:.78rem;padding:.15rem .5rem;border-radius:2rem;background:#ffffff10;color:#9aa3bb}
.ucard2 .row .pr{margin-left:auto;background:#8e1c1c;color:#fff;cursor:pointer}
.units{grid-template-columns:repeat(4,1fr)}

/* 사건 화면 배경 */
#case{background:linear-gradient(#0a0e16e6,#0a0e16f0),var(--casebg,none) center/cover fixed}
.topbar{background:#0f1622;border:2px solid #34425c;margin:.5rem .6rem 0;border-radius:.7rem;padding:.45rem .8rem;box-shadow:0 0 0 2px #0a0e16}
.topbar .ctitle{display:flex;align-items:center;gap:.7rem}
.hlogo{height:2.6rem}
.cbadge{background:linear-gradient(180deg,#9b2020,#701414);border:2px solid #c9a35a;color:#fff;font-weight:900;padding:.15rem .8rem;border-radius:.35rem;font-size:1.15rem}
.cname{font-weight:900;font-size:1.15rem}
.steps button{background:#1a2333;border:1px solid #3a4a66;color:#aab3c5;border-radius:.3rem;font-weight:700}
.steps button.on{background:linear-gradient(180deg,#a52222,#7a1616);color:#fff;border-color:#d4a95e}
.steps button.done{color:#e8ecf4}
.timer{background:#05070b;border:1px solid #3a4a66}
.navbar{background:linear-gradient(0deg,#0a0e16 70%,transparent)}
.sec-title .num{background:linear-gradient(180deg,#a52222,#7a1616);color:#fff;border:2px solid #c9a35a}

/* 양피지 패널 + 빨간 이름표 */
.casefile,.side-card,.rule-box{background:linear-gradient(180deg,#efe2c3,#e2cfa6);color:#2b2117;border:3px solid #3b475f;box-shadow:inset 0 0 0 3px #b99c66,0 0 0 2px #0a0e16,0 .8rem 2rem #0009;border-radius:.7rem;transform:none}
.casefile{padding:1.2rem 1.4rem}
.casefile:before{content:'사건 기록';font-family:'Noto Sans KR';font-weight:900;font-size:1.25rem;background:linear-gradient(180deg,#a52222,#7a1616);border:2px solid #d4a95e;padding:.2rem 1rem;left:1rem;top:-1.1rem;transform:none;border-radius:.3rem}
.casehero{width:100%;border-radius:.5rem;border:2px solid #b99c66;margin:.6rem 0 .4rem;display:block}
.casefile p{font-size:1.1rem;color:#2b2117}
.casefile .ten{color:#8e1c1c;font-family:'Noto Sans KR';font-weight:700}
.casefile .meta span{background:#e9d9b2;border:1px solid #b99c66}
.side-card h3,.rule-box h3{display:inline-block;background:linear-gradient(180deg,#a52222,#7a1616);color:#fff!important;border:2px solid #d4a95e;padding:.25rem 1rem;border-radius:.3rem;font-size:1.15rem;margin:-1.6rem 0 .7rem -.4rem;font-weight:900}
.side-card,.rule-box{margin-top:1.4rem;padding:1rem 1.1rem}
.rule-box{line-height:1.8;font-size:1rem}
.rule-box b{color:#8e1c1c}
.side-card .expr{background:#fbf6ea;border:1px solid #cdb487;border-radius:.4rem;padding:.35rem .6rem;margin:.35rem 0}
.side-card .expr .e{color:#1e2a44;font-weight:700;font-size:1.15rem}
.side-card .expr .k{color:#6b5a42}
.spk{background:#1d2c4c;color:#fff}
.story p{color:#2b2117}
.keyev .k{background:#fbf6ea;border:1px solid #cdb487;border-left:.35rem solid #8e1c1c}
.keyev .k b{color:#8e1c1c} .keyev .k span{color:#3a2e20}
.score .ok{background:#1f6b42;color:#fff} .score .no{background:#7a1616;color:#fff}

/* 질문 카드 */
.qcard{background:linear-gradient(180deg,#f3e7cc,#e6d3aa);border:2px solid #b99c66;border-radius:.5rem;box-shadow:0 .2rem 0 #0006}

/* ---------- 3. alibi ---------- */

  <div class="qcards" style="margin:0 0 1rem">${C.alibiQ.map(([e, k]) => `<div class="qcard">${spk(e)}<div><div class="e">${esc(e)}</div><div class="k">${esc(k)}</div></div></div>`).join('')}</div>
  <div class="sus-grid">${C.suspects.map(s => {

/* ---------- 4. evidence ---------- */
const allEv = () => {
  const out = [];
  C.places.forEach(p => p.ev.forEach(e => out.push({ ...e, where: p.name })));
  C.suspects.forEach(s => (C.bags[s.id] || []).forEach(e => out.push({ ...e, where: s.name + '의 소지품' })));
  return out;
};
const findEv = id => allEv().find(e => e.id === id);
function evTile(e) {
  const o = state.opened[e.id];
  const lk = e.type === 'lock' && !state.unlockedLocks[e.id];
  return `<button class="ev ${o ? 'open' : ''} ${lk && o ? 'lockd' : ''}" onclick="pickEv('${e.id}')">
    ${o ? `<span class="q">${e.icon || '📄'}</span><span class="n">${esc(e.title)}</span><span class="who">${o}모둠</span>` : `<span class="q">?</span><span class="n">증거</span>`}
  </button>`;
}
function rEvidence() {
  const total = allEv().length, got = Object.keys(state.opened).length;
  const cur = state.order[state.turnIdx];
  $('#stage').innerHTML = `
  <div class="sec-title"><span class="num">4</span>증거 수집</div>
  <div class="turnbar">
    <span>지금 차례</span><span class="now">${cur}모둠</span>
    <span style="color:var(--dim)">· 한 번에 ${state.picksPerTurn}개 (${state.pickCount}/${state.picksPerTurn})</span>
    <div class="teamchips">${state.order.map((t, i) => `<span class="${i === state.turnIdx ? 'on' : ''}">${t}</span>`).join('→')}</div>
    <span style="margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
      모둠 수 <select id="teamSel" onchange="setupTeams(+this.value);rEvidence()">${[2, 3, 4, 5, 6, 7, 8].map(n => `<option ${n === state.teams ? 'selected' : ''}>${n}</option>`).join('')}</select>
      한 번에 <select onchange="state.picksPerTurn=+this.value;rEvidence()">${[1, 2, 3].map(n => `<option ${n === state.picksPerTurn ? 'selected' : ''}>${n}</option>`).join('')}</select>개
      <button class="btn sm ghost" onclick="setupTeams(state.teams);rEvidence()">🔀 순서 다시</button>
      <button class="btn sm ghost" onclick="nextTurn();rEvidence()">차례 넘기기</button>
    </span>
  </div>
  <div class="board">
    <div>
      <div class="places">${C.places.map(p => `
        <div class="place">
          <div class="ph">${picon(p)}<div><div class="pn">${esc(p.name)}</div><div class="pe">${esc(p.nameEn)}</div></div></div>
          <div class="pd">${esc(p.desc)}</div>
          <div class="evs">${p.ev.map(evTile).join('')}</div>
        </div>`).join('')}</div>
      <div class="bagrow">${C.suspects.map(s => `
        <div class="bag">${avatar(s.look)}<div style="flex:1"><div class="bn">${esc(s.name)}의 소지품</div><div class="evs" style="margin-top:.3rem">${(C.bags[s.id] || []).map(evTile).join('')}</div></div></div>`).join('')}</div>
    </div>
    <div class="notebook">
      <h3>🕵️ 탐정 수첩</h3>
      <div class="cnt">FOUND ${got} / ${total}</div>
      <ol>${state.openOrder.map(id => { const e = findEv(id); return `<li onclick="showEv('${id}')">${e.icon || '📄'} ${esc(e.title)} <small>· ${esc(e.where)}</small></li>`; }).join('') || '<li style="list-style:none;color:#8a7a62">아직 찾은 증거가 없어요.</li>'}</ol>
      <div style="margin-top:1rem;display:flex;gap:.4rem;flex-wrap:wrap">
        <button class="btn sm" onclick="if(confirm('남은 증거를 모두 공개할까요?')){allEv().forEach(e=>{if(!state.opened[e.id]){state.opened[e.id]='-';state.openOrder.push(e.id)}});rEvidence()}">모두 공개</button>
      </div>
    </div>
  </div>`;
}
function nextTurn() { state.pickCount = 0; state.turnIdx = (state.turnIdx + 1) % state.order.length; }
function pickEv(id) {
  if (!state.opened[id]) {
    state.opened[id] = state.order[state.turnIdx];
    state.openOrder.push(id);
    state.pickCount++;
    if (state.pickCount >= state.picksPerTurn) nextTurn();
  }
  sfx.open(); showEv(id); rEvidence();
}
function showEv(id, banner) {
  const e = findEv(id);
  modal(`
    ${banner ? `<div class="present-banner">${banner}</div>` : ''}
    <div class="evhead"><span class="tg">EVIDENCE</span><h2>${e.icon || ''} ${esc(e.title)}</h2><span class="wh">· ${esc(e.where)}</span></div>
    <div class="evbody" id="evBody">${renderEv(e)}</div>
    <div class="evtools">
      ${speakText(e) ? `<button class="btn b" onclick="say(decodeURIComponent('${encodeURIComponent(speakText(e)).replace(/'/g, '%27')}'))">🔊 영어로 듣기</button>` : ''}
      ${e.words && e.words.length ? `<button class="btn" onclick="document.getElementById('evWords').classList.toggle('hidden')">📘 단어 도움</button>` : ''}
      ${e.ko ? `<button class="btn" onclick="document.getElementById('evKo').classList.toggle('hidden')">🇰🇷 해석 보기</button>` : ''}
      ${window.ROLE === 'tablet' ? `<button class="btn y" onclick="tabPresent('${id}')">📺 TV에 보여 주기</button>` : ''}
    </div>
    <div class="words hidden" id="evWords">${(e.words || []).map(([a, b]) => `<span><b>${esc(a)}</b>${esc(b)}</span>`).join('')}</div>
    <div class="kotrans hidden" id="evKo">${esc(e.ko || '')}</div>`);
  if (e.type === 'lock') setTimeout(() => { const i = $('#lockIn'); i && i.focus(); }, 50);
}
function speakText(e) {
  if (e.type === 'lock') return state.unlockedLocks[e.id] ? (e.open && e.open.text) || '' : e.text;
  if (e.type === 'chat') return e.msgs.map(m => m[1]).join(' ');
  if (e.type === 'table') return [e.head, e.foot].filter(Boolean).join('. ');
  if (e.type === 'map') return e.text || '';
  if (e.type === 'calendar') return e.foot || '';
  return [e.head, e.text, e.from].filter(Boolean).join('. ');
}
function renderEv(e) {
  const t = e.type;
  const nl = s => esc(s);
  if (t === 'note') return `<div class="paper note">${nl(e.text)}${e.from ? `<span class="from">${esc(e.from)}</span>` : ''}</div>`;
  if (t === 'sign') return `<div class="paper sign"><div class="sh">${esc(e.head || '')}</div><div class="sb">${nl(e.text)}</div></div>`;
  if (t === 'poster') return `<div class="paper poster"><div class="sh">${esc(e.head || '')}</div><div class="sb">${nl(e.text)}</div></div>`;
  if (t === 'diary') return `<div class="paper diary"><span class="dd">${esc(e.date || '')}</span>\n${nl(e.text)}</div>`;
  if (t === 'letter') return `<div class="paper letter">${nl(e.text)}</div>`;
  if (t === 'table') return `<div class="paper table"><div class="sh">${esc(e.head || '')}</div><table><tr>${e.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${e.rows.map(r => `<tr class="${r.hl ? 'hl' : ''}">${(r.c || r).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${e.foot ? `<div class="foot">${esc(e.foot)}</div>` : ''}</div>`;
  if (t === 'chat') return `<div class="phone"><div class="pt">💬 ${esc(e.head || 'Messages')}</div><div class="scr">${e.msgs.map(([w, m]) => `<div class="bub ${w === e.me ? 'me' : ''}"><span class="s">${esc(w)}</span>${esc(m)}</div>`).join('')}</div></div>`;
  if (t === 'photo') {
    const ppl = (e.people || []).map(id => { const s = C.suspects.find(x => x.id === id); return s ? avatar(s.look) : ''; }).join('');
    const custom = (e.looks || []).map(l => avatar(l)).join('');
    return `<div class="photo"><div class="pic ${e.cctv ? 'cctv' : ''}">${e.big ? `<span class="big">${e.big}</span>` : ''}${ppl}${custom}${e.ts ? `<span class="ts">${esc(e.ts)}</span>` : ''}</div><div class="cap">${nl(e.text || '')}</div></div>`;
  }
  if (t === 'item') return `<div class="item"><div class="big">${e.big || e.icon || '📦'}</div><div class="desc">${nl(e.text)}</div></div>`;
  if (t === 'calendar') {
    const first = e.start || 0, days = e.days || 30;
    let cells = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => `<div class="dw">${d}</div>`).join('');
    for (let i = 0; i < first; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) { const m = e.marks && e.marks[d]; cells += `<div class="${m ? 'mk' : ''}">${d}${m ? `<i>${esc(m)}</i>` : ''}</div>`; }
    return `<div class="cal"><div class="ch">${esc(e.head)}</div><div class="cg">${cells}</div>${e.foot ? `<div class="foot">${esc(e.foot)}</div>` : ''}</div>`;
  }
  if (t === 'map') {
    const cols = e.grid[0].length;
    return `<div><div class="mapg" style="grid-template-columns:repeat(${cols},auto)">${e.grid.flat().map(c => {
      if (c === '=') return '<div class="road">road</div>';
      if (c === '') return '<div class="empty"></div>';
      const [ic, nm] = c.split('|'); return `<div><b>${ic}</b>${esc(nm || '')}</div>`;
    }).join('')}</div>${e.text ? `<div class="mapcap">${esc(e.text)}</div>` : ''}</div>`;
  }
  if (t === 'lock') {
    if (state.unlockedLocks[e.id]) return `<div style="text-align:center"><div style="color:var(--green);font-family:'Black Han Sans';font-size:1.6rem;margin-bottom:.6rem">🔓 열렸다!</div>${renderEv({ ...e.open, id: e.id + '_o' })}</div>`;
    return `<div class="lockbox"><div class="big">${e.big || '🔒'}</div><div class="lp">${nl(e.text)}</div>
      <input id="lockIn" maxlength="12" placeholder="${'_'.repeat(String(e.answer).length)}" onkeydown="if(event.key==='Enter')tryLock('${e.id}')"><button class="btn y" onclick="tryLock('${e.id}')">열기</button>
      <div class="wrong" id="lockWrong">${e.hint ? '💡 힌트: ' + esc(e.hint) : ''}</div></div>`;
  }
  return `<div class="paper">${nl(e.text || '')}</div>`;
}
function tryLock(id) {
  const e = findEv(id), v = ($('#lockIn').value || '').trim().toUpperCase().replace(/\s+/g, '');
  if (v === String(e.answer).toUpperCase()) { state.unlockedLocks[id] = true; sfx.lock(); if (window.onLockOpened) window.onLockOpened(id); showEv(id); if (window.ROLE !== 'tablet' && STEPS[state.step][1] === 'evidence') rEvidence(); }
  else { sfx.bad(); $('#lockWrong').textContent = '❌ 틀렸어요. 다른 증거에서 단서를 찾아보세요!'; $('#lockIn').select(); }
}

/* ---------- 5. lie detector ---------- */
function rDetector() {
  const L = state.ld;
  $('#stage').innerHTML = `
  <div class="sec-title"><span class="num">5</span>심문 & 거짓말탐지기</div>
  <p class="sec-sub">모둠마다 <b>${state.ldPerTeam}번</b> 용의자 한 명에게 '예/아니오' 질문을 할 수 있어요. 질문은 영어로! 용의자가 대답하면 선생님이 탐지기를 작동시켜요.</p>
  <div class="qcards" style="margin:0 0 1rem">${C.interrogate.map(([e, k]) => `<div class="qcard">${spk(e)}<div><div class="e">${esc(e)}</div><div class="k">${esc(k)}</div></div></div>`).join('')}</div>

    <div class="machine">
      
      <div class="ldm"><img src="assets/ui/ld.webp" alt="" draggable="false"><svg class="ldn" viewBox="0 0 694 549"><g id="needle" style="transform-origin:348px 320px;transform:rotate(0deg);transition:transform .25s"><path d="M348 322 L348 222" stroke="#b3171d" stroke-width="7" stroke-linecap="round"/><circle cx="348" cy="320" r="11" fill="#c9a35a" stroke="#5a4320" stroke-width="3"/></g></svg><i class="lmp g" id="lmpG"></i><i class="lmp y" id="lmpY"></i><i class="lmp r" id="lmpR"></i></div>
      <div class="ld-result" id="ldRes"></div>
      <div style="color:var(--dim);font-size:.9rem">질문하는 모둠</div>
      <div class="ld-pick">${[...Array(state.teams)].map((_, i) => { const t = i + 1, u = L.used[t] || 0; return `<button class="${L.team === t ? 'on' : ''}" ${u >= state.ldPerTeam ? 'disabled style="opacity:.35"' : ''} onclick="state.ld.team=${t};rDetector()">${t}모둠 <small>${u}/${state.ldPerTeam}</small></button>`; }).join('')}</div>
      <div style="color:var(--dim);font-size:.9rem">질문받는 용의자</div>
      <div class="ld-pick">${C.suspects.map(s => `<button class="${L.sus === s.id ? 'on' : ''}" onclick="state.ld.sus='${s.id}';rDetector()">${avatar(s.look)}${esc(s.name)}</button>`).join('')}</div>
      <div style="color:var(--dim);font-size:.9rem">용의자의 대답</div>
      <div class="ans"><button class="btn g" style="${L.answer === 'Yes' ? 'outline:.25rem solid #fff' : ''}" onclick="state.ld.answer='Yes';rDetector()">YES</button><button class="btn r" style="${L.answer === 'No' ? 'outline:.25rem solid #fff' : ''}" onclick="state.ld.answer='No';rDetector()">NO</button></div>
      <div class="secret">선생님 전용: 대답이 사실이면 <b>T</b>키 / 거짓이면 <b>F</b>키 (또는 <a href="#" style="color:#8ff0bd" onclick="ldJudge(true);return false">참</a> · <a href="#" style="color:#ff9da2" onclick="ldJudge(false);return false">거짓</a>)</div>
      <div style="margin-top:.6rem;font-size:.85rem;color:var(--dim)">모둠당 질문 횟수 <select onchange="state.ldPerTeam=+this.value;rDetector()">${[1, 2, 3].map(n => `<option ${n === state.ldPerTeam ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    </div>
    <div class="ld-log">
      <h3 style="margin:.2rem 0 .6rem;color:var(--tape)">📋 탐지 기록</h3>
      <table><tr><th>모둠</th><th>용의자</th><th>대답</th><th>결과</th></tr>
      ${L.log.map(r => `<tr><td>${r.team}모둠</td><td>${esc(r.sus)}</td><td>${r.answer}</td><td><span class="lamp on ${r.truth ? 't' : 'f'}"></span>${r.truth ? '진실' : '거짓'}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--dim)">아직 기록이 없어요.</td></tr>'}
      </table>
      <div style="margin-top:1rem;font-size:.9rem;color:var(--dim);line-height:1.6">💡 질문 예시<br>${C.ldExamples.map(q => `<span class="en" style="font-size:1.2rem;color:var(--ink)">• ${esc(q)}</span>`).join('<br>')}</div>

function ldJudge(truth) {
  const L = state.ld;
  if (!L.sus || !L.team) { alert('질문하는 모둠과 용의자를 먼저 골라 주세요.'); return; }
  const n = $('#needle'), res = $('#ldRes'); if (!n) return;
  res.className = 'ld-result'; res.textContent = '...';
  let k = 0;
  const wob = setInterval(() => { n.style.transform = `rotate(${(Math.random() * 140 - 70).toFixed(0)}deg)`; sfx.beep(); if (++k > 12) { clearInterval(wob); n.style.transform = `rotate(${truth ? -62 : 62}deg)`; res.className = 'ld-result ' + (truth ? 't' : 'f'); res.textContent = truth ? '진실 TRUE' : '거짓 LIE'; truth ? sfx.truth() : sfx.lie();
    const s = C.suspects.find(x => x.id === L.sus);
    L.log.unshift({ team: L.team, sus: s.name, answer: L.answer || '-', truth });
    L.used[L.team] = (L.used[L.team] || 0) + 1;
    setTimeout(() => { L.team = null; L.answer = null; const keep = { c: res.className, t: res.textContent }; rDetector(); const r2 = $('#ldRes'); r2.className = keep.c; r2.textContent = keep.t; $('#needle').style.transform = `rotate(${truth ? -62 : 62}deg)`; }, 1400);
  } }, 110);
}

/* ---------- 6. vote ---------- */

  if (!state.voteTeam) state.voteTeam = 1;
  $('#stage').innerHTML = `
  <div class="sec-title"><span class="num">6</span>범인 지목</div>
  <p class="sec-sub">모둠마다 의논한 뒤 범인을 한 명 지목해요. 모둠 버튼을 누르고 용의자 카드를 누르세요. 용의자 역할 학생도 개인적으로 지목할 수 있어요.</p>
  <div class="vote-teams">${[...Array(state.teams)].map((_, i) => { const t = i + 1, v = state.votes[t]; return `<button class="${state.voteTeam === t ? 'on' : ''}" onclick="state.voteTeam=${t};rVote()">${t}모둠${v ? `<span class="ch">✔</span>` : ''}</button>`; }).join('')}
    <button class="btn sm ghost" onclick="state.votes={};rVote()">초기화</button>
    <span style="color:var(--dim);margin-left:auto">지목 완료 ${Object.values(state.votes).filter(Boolean).length} / ${state.teams}</span></div>
  <div class="sus-grid">${C.suspects.map(s => `<div class="sus ${state.votes[state.voteTeam] === s.id ? 'accused' : ''}" onclick="castVote('${s.id}')">
      ${tally[s.id] ? `<span class="votes">${tally[s.id]}표</span>` : ''}
      ${avatar(s.look, { cls: 'av' })}<div class="nm">${esc(s.name)}</div><div class="nk">${esc(s.nick)}</div>
      <div class="kor" style="margin-top:.5rem">${[...Array(state.teams)].map((_, i) => state.votes[i + 1] === s.id ? `<span class="pill">${i + 1}모둠</span>` : '').join('')}</div>
    </div>`).join('')}</div>
  <div class="qcards" style="justify-content:center;margin-top:1.4rem"><div class="qcard">${spk(C.accuseEn)}<div><div class="e">${esc(C.accuseEn)}</div><div class="k">범인을 지목할 때 이렇게 말해요</div></div></div></div>`;
}
function castVote(id) {
  state.votes[state.voteTeam] = id; sfx.drum();
  const nx = [...Array(state.teams)].map((_, i) => i + 1).find(t => !state.votes[t]);
  if (nx) state.voteTeam = nx;
  rVote();
}

/* ---------- 7. reveal ---------- */
function rReveal() {
  const culp = C.suspects.find(s => s.culprit);
  if (!state.revealed) {
    $('#stage').innerHTML = `<div class="sec-title"><span class="num">7</span>범인 공개</div>
      <div class="drum" id="drum">${C.suspects.map(s => susCard(s)).join('')}</div>
      <div style="text-align:center"><button class="btn r" style="font-size:1.6rem;padding:.8rem 2rem" onclick="drumRoll()">🚨 범인은 바로…!</button></div>`;
    return;
  }
  const right = [], wrong = [];
  for (let t = 1; t <= state.teams; t++) { if (!state.votes[t]) continue; (state.votes[t] === culp.id ? right : wrong).push(t); }
  $('#stage').innerHTML = `
  <div class="sec-title"><span class="num">7</span>사건의 전말</div>
  <div class="reveal">
    <div>
      <div class="culprit-card" id="ccard">${avatar({ ...culp.look, mood: 'flat' })}<div class="nm">${esc(culp.name)}</div><div style="color:#ffb3b6">${esc(culp.nick)}</div><div class="stampc">범인!</div></div>
      ${Object.keys(state.votes).length ? `<div class="score">${right.map(t => `<span class="ok">🎉 ${t}모둠 정답</span>`).join('')}${wrong.map(t => `<span class="no">${t}모둠</span>`).join('')}</div>` : ''}
      <div class="side-card" style="margin-top:1rem"><h3>범인의 진짜 행적</h3><div style="line-height:1.7;font-size:.95rem">${culp.truth.map(esc).join('<br>')}</div></div>
    </div>
    <div>
      <div class="side-card story"><h3>📜 사건의 전말</h3>${C.solution.story.map(p => `<p>${esc(p)}</p>`).join('')}</div>
      <div class="side-card"><h3>🔎 결정적 증거</h3><div class="keyev">${C.solution.key.map(k => { const e = findEv(k.ev); return `<div class="k" onclick="showEv('${k.ev}')"><b>${e ? (e.icon || '') + ' ' + esc(e.title) : ''}</b><span>${esc(k.why)}</span></div>`; }).join('')}</div></div>
    </div>
  </div>`;
  setTimeout(() => { const c = $('#ccard'); c && c.classList.add('go'); }, 300);
}
function drumRoll() {
  const cards = [...document.querySelectorAll('#drum .sus')], culp = C.suspects.findIndex(s => s.culprit);
  let i = 0, n = 18 + culp + Math.floor(Math.random() * 2) * 4;
  n = n - (n % 4) + culp;
  const step = () => {
    cards.forEach(c => c.classList.remove('hl')); cards[i % 4].classList.add('hl'); sfx.drum();
    if (i >= n) { setTimeout(() => { sfx.sting(); state.revealed = true; rReveal(); }, 700); return; }
    i++; setTimeout(step, 80 + i * 9);
  };
  step();
}

/* ---------- DB: Firebase, 안 되면 체험 모드(같은 브라우저 안에서만) ---------- */
const DB = (() => {
  let mode = 'local', fdb = null, offset = 0;
  const L = {};
  const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
  const tree = () => { try { return JSON.parse(localStorage.getItem('cs_db') || '{}'); } catch (e) { return {}; } };
  const at = (t, p) => p.split('/').filter(Boolean).reduce((o, k) => (o == null ? undefined : o[k]), t);
  const put = (t, p, v) => {
    const ks = p.split('/').filter(Boolean); let o = t;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const fire = () => { const t = tree(); for (const p in L) L[p].forEach(cb => cb(clone(at(t, p)))); };
  const save = t => { localStorage.setItem('cs_db', JSON.stringify(t)); fire(); };
  window.addEventListener('storage', e => { if (e.key === 'cs_db') fire(); });
  return {
    get mode() { return mode; },
    now() { return Date.now() + offset; },
    init() {
      try {
        if (window.firebase && FIREBASE_CONFIG.apiKey && !/[?&]local/.test(location.search)) {
          firebase.initializeApp(FIREBASE_CONFIG); fdb = firebase.database(); mode = 'firebase';
          fdb.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
        }
      } catch (e) { mode = 'local'; }
    },
    on(p, cb) {
      if (mode === 'firebase') { const r = fdb.ref(p); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); }
      (L[p] = L[p] || []).push(cb); cb(clone(at(tree(), p)));
      return () => { L[p] = L[p].filter(x => x !== cb); };
    },
    set(p, v) { if (mode === 'firebase') return fdb.ref(p).set(v); const t = tree(); put(t, p, v); save(t); return Promise.resolve(); },
    update(p, o) { if (mode === 'firebase') return fdb.ref(p).update(o); const t = tree(); for (const k in o) put(t, p + '/' + k, o[k]); save(t); return Promise.resolve(); },
    async txn(p, fn) {
      if (mode === 'firebase') { const r = await fdb.ref(p).transaction(fn); return r.committed ? r.snapshot.val() : undefined; }
      const t = tree(); const v = fn(at(t, p) ?? null); if (v === undefined) return undefined; put(t, p, v); save(t); return v;
    },
    async get(p) { if (mode === 'firebase') return (await fdb.ref(p).get()).val(); return clone(at(tree(), p)); }
  };
})();
DB.init();

const psOf = (R, key) => (R.ps && R.ps[key]) || {};
const openedOf = (R, key) => psOf(R, key).opened || {};
const membersOf = (R, g) => Object.entries(R.members || {}).filter(([, m]) => m.g === g).map(([k, m]) => ({ k, ...m }));
function priceFor(R, key, openedCount) {
  const k = openedCount ?? Object.keys(openedOf(R, key)).length;
  return Math.max(2, (R.priceB ?? 3) + (R.priceS ?? 1) * k);
}
const priceName = R => (PRICE.find(p => p.b === R.priceB && p.s === R.priceS) || {}).n || '';
function solveLeft(R) { if (R.solvePaused != null) return R.solvePaused; if (!R.solveEnd) return null; return Math.max(0, R.solveEnd - DB.now()); }
function solveState(R) {
  if (R.solvePaused != null) return 'paused';
  if (!R.solveEnd) return 'wait';
  return solveLeft(R) > 0 ? 'running' : 'ended';
}

function pickOthers(pool, ans, n) { return shuffle([...new Set(pool.filter(x => x && x !== ans))]).slice(0, n); }
function buildDeck(c) {
  const Q = QBANK[c.unit] || { words: [], blanks: [], replies: [], orders: [], reads: [] };
  const deck = [], W = Q.words || [];
  W.forEach(([en, ko]) => {
    deck.push({ t: '단어 뜻', p: en, sub: '이 단어의 뜻은?', a: ko, ch: pickOthers(W.map(w => w[1]), ko, 3), pts: 1, say: en });
    deck.push({ t: '영어 단어', p: ko, sub: '알맞은 영어 단어는?', a: en, ch: pickOthers(W.map(w => w[0]), en, 3), pts: 1 });
  });
  (Q.blanks || []).forEach(([s, a, wrong, ko]) => deck.push({ t: '빈칸 채우기', p: s, sub: ko, a, ch: wrong.slice(0, 3), pts: 2 }));
  (Q.replies || []).forEach(([q, a, wrong]) => deck.push({ t: '알맞은 대답', p: q, sub: '알맞은 대답을 고르세요', a, ch: wrong.slice(0, 3), pts: 2, say: q }));
  (Q.reads || []).forEach(([txt, q, a, wrong]) => deck.push({ t: '읽고 답하기', pre: txt, p: q, sub: '글을 읽고 답하세요', a, ch: wrong.slice(0, 3), pts: 3 }));
  const seen = new Set(), sents = [];
  const add = (e, k) => { if (!e || !k || seen.has(e)) return; seen.add(e); sents.push([e, k]); };
  (Q.orders || []).forEach(([e, k]) => add(e, k));
  [...c.keyExpr, ...c.alibiQ, ...c.interrogate].forEach(([e, k]) => add(e, k));
  c.suspects.forEach(s => { add(s.introEn, s.introKo); add(s.alibiEn, s.alibiKo); s.lines.forEach(([e, k]) => add(e, k)); });
  sents.forEach(([e, k]) => {
    deck.push({ t: '문장 뜻', p: e, sub: '이 문장의 뜻은?', a: k, ch: pickOthers(sents.map(x => x[1]), k, 3), pts: 2, say: e });
    const w = e.split(/\s+/);
    if (w.length >= 3 && w.length <= 9) deck.push({ t: '문장 만들기', order: true, words: w, a: e, sub: k, pts: 3 });
  });
  return deck.filter(q => q.order || q.ch.length >= 2);
}

      <h3 class="th">📋 탐지 기록</h3><div class="tlog">${log.map(r => `<div><b>${r.team}모둠</b> → ${esc(r.sus)} · ${r.answer} · <span class="lamp on ${r.truth ? 't' : 'f'}"></span>${r.truth ? '진실' : '거짓'}</div>`).join('') || '<div style="color:var(--dim)">아직 기록이 없어요.</div>'}</div>`;
  }
  if (kind === 'vote') {

    const pick = n.pick || (v && v.sus) || '';
    body = `<div class="tvsign">🚨 개인전! 내가 모은 증거로 범인을 한 명 고르고, 이유를 영어로 써서 제출해요. 친구에게 답을 알려 주면 안 돼요!</div>
      ${v ? `<div class="tsub">✔ 내가 제출한 범인: <b>${esc((C.suspects.find(s => s.id === v.sus) || {}).name || '')}</b> <span class="en">${esc(v.why || '')}</span> <small>(공개 전까지 바꿀 수 있어요)</small></div>` : ''}
      <div class="tsus pickable">${C.suspects.map(s => `<button class="tsc ${pick === s.id ? 'on' : ''}" onclick="note.set('pick','${s.id}');tabRender()">${avatar(s.look)}<b>${esc(s.name)}</b><small>${esc(s.nick)}</small></button>`).join('')}</div>
      <div class="twhy"><div class="en">I think the culprit is <b>${esc((pick && (C.suspects.find(s => s.id === pick) || {}).name) || '_____')}</b>.</div>
      <div class="en">Because</div><div class="whyrow"><textarea id="whyIn" placeholder="she was not in the library." oninput="note.set('why',this.value)">${esc(n.why || '')}</textarea>
      <button class="btn y" onclick="tabVote()">${v ? '다시 제출' : '제출하기'} ▶</button></div></div>`;
  }
  if (kind === 'reveal') {
    if (!R.revealed) body = tv('두구두구… TV에서 범인이 공개돼요!');
    else {
      const culp = C.suspects.find(s => s.culprit), V = R.votes || {}, v = V[T.key], ok = v && v.sus === culp.id;
      const okList = membersOf(R, g).filter(m => V[m.k] && V[m.k].sus === culp.id).sort((a, b) => (V[a.k].t || 0) - (V[b.k].t || 0));
      const rank = okList.findIndex(m => m.k === T.key) + 1;
      body = `<div class="tres ${ok ? 'ok' : 'no'}"><img class="emb" src="assets/ui2/${ok ? 'clear' : 'fail'}.webp" alt="">${ok ? (rank === 1 ? '🥇 정답! 우리 모둠에서 가장 먼저 맞혔어요!' : `🎉 정답! 우리 모둠에서 ${rank}번째로 맞혔어요!`) : (v ? '😢 아쉬워요! 범인은 다른 사람이었어요.' : '범인이 공개되었어요.')}</div>
        <div class="tsus"><div class="tsc on">${avatar(culp.look)}<b>${esc(culp.name)}</b><small>범인!</small></div></div>

}
function paneSync() { const gd = $('#solveGrid'); if (!gd) return; gd.dataset.pane = T.pane; $('#pq').classList.toggle('on', T.pane === 'quiz'); $('#pb').classList.toggle('on', T.pane === 'board'); }
function drawSolveBar() {
  const R = T.R, g = myG(), G = psOf(R, T.key), st = solveState(R), left = solveLeft(R);
  const me = (R.members && R.members[T.key]) || {};
  $('#solveBar').innerHTML = `
    <div class="sb-clock"><small>${{ wait: '시작 전', running: '남은 시간', paused: '잠깐 멈춤', ended: '시간 끝' }[st]}</small><b class="sclock">${fmt(left ?? R.solveMin * 60000)}</b></div>
    <div class="sb-cred"><small>내 크레딧</small><b><i class="coin"></i> ${G.credits || 0}</b></div>
    <div class="sb-price"><small>다음 증거 가격</small><b>${priceFor(R, T.key)}</b></div>
    <div class="sb-me"><small>내가 맞힌 문제</small><b>${me.score || 0}</b></div>`;
}
function drawBoard() {
  const R = T.R, G = psOf(R, T.key), op = G.opened || {}, price = priceFor(R, T.key), cred = G.credits || 0;
  const tile = e => {
    const seen = canSee(e.id), mine = !!op[e.id], lk = e.type === 'lock' && !state.unlockedLocks[e.id];
    return `<button class="ev ${seen ? 'open' : ''} ${lk && seen ? 'lockd' : ''} ${!seen && cred < price ? 'dead' : ''}" onclick="tabPick('${e.id}')">
      ${seen ? `${evThumb(e)}${mine ? '' : '<span class="who">공개</span>'}` : `<span class="q">?</span><span class="n"><i class="coin"></i> ${price}</span>`}</button>`;
  };
  $('#boardBox').innerHTML = `${R.allOpen ? '<div class="tsub" style="color:var(--green)">선생님이 모든 증거를 공개했어요!</div>' : ''}
    <div class="tplaces">${C.places.map(p => `<div class="place"><div class="ph">${picon(p)}<div><div class="pn">${esc(p.name)}</div><div class="pe">${esc(p.nameEn)}</div></div></div><div class="evs">${p.ev.map(tile).join('')}</div></div>`).join('')}</div>
    <h3 class="th">🎒 용의자의 소지품</h3>
    <div class="tbags">${C.suspects.map(s => `<div class="bag">${avatar(s.look)}<div style="flex:1"><div class="bn">${esc(s.name)}</div><div class="evs" style="margin-top:.3rem">${(C.bags[s.id] || []).map(tile).join('')}</div></div></div>`).join('')}</div>
    <p class="tip">💡 개인전이에요! 산 증거는 나만 볼 수 있어요. 증거를 많이 사려면 문제를 많이 맞히세요.</p>`;
}

/* ---------- 문제 풀기 ---------- */
function nextQ() {
  if (!T.deck.length) T.deck = shuffle(T.deckBase);
  const q = T.deck.pop();
  return q.order ? { ...q, chips: shuffle(q.words.map((w, i) => ({ w, i }))), built: [] } : { ...q, opts: shuffle([q.a, ...q.ch]) };
}
function renderQuiz() {
  const box = $('#quizBox'); if (!box || !T) return;
  const st = solveState(T.R); T.quizState = st;
  if (st === 'wait') { box.innerHTML = `<div class="qwait">⏳<b>선생님이 [문제 시작]을 누르면</b>영어 문제가 열려요.<br>맞힌 점수는 내 크레딧이 돼요!</div>`; return; }
  if (st === 'paused') { box.innerHTML = `<div class="qwait">⏸<b>잠깐 멈췄어요</b>TV를 보세요.</div>`; return; }
  if (st === 'ended') { box.innerHTML = `<div class="qwait">⏰<b>문제 시간이 끝났어요!</b>남은 크레딧으로 증거를 사세요.<br>[🔍 증거 사기]를 눌러 보세요.</div>`; return; }
  if (!T.cur) T.cur = nextQ();
  const q = T.cur;
  box.innerHTML = `<div class="qcardx">
    <div class="qtop"><span class="qtype">${q.t}</span><span class="qpts">+${q.pts}</span>${T.streak >= 2 ? `<span class="qstreak">🔥 ${T.streak}연속</span>` : ''}</div>
    ${q.pre ? `<div class="qpre en">${esc(q.pre)}</div>` : ''}
    <div class="qp ${/[가-힣]/.test(q.p) ? '' : 'en'}">${q.order ? esc(q.sub) : esc(q.p)} ${q.say ? spk(q.say) : ''}</div>
    <div class="qsub">${q.order ? '단어를 순서대로 눌러 영어 문장을 만드세요' : esc(q.sub)}</div>
    ${q.order ? `<div class="qbuilt en" id="qBuilt">${q.built.map((c, j) => `<button onclick="qUnpick(${j})">${esc(c.w)}</button>`).join('') || '<span>여기에 문장이 만들어져요</span>'}</div>
      <div class="qchips">${q.chips.map((c, j) => q.built.includes(c) ? `<button class="used" disabled>${esc(c.w)}</button>` : `<button class="en" onclick="qPick(${j})">${esc(c.w)}</button>`).join('')}</div>
      <div class="qact"><button class="btn ghost" onclick="T.cur.built=[];renderQuiz()">다시</button><button class="btn y" onclick="qCheckOrder()" ${q.built.length === q.chips.length ? '' : 'disabled'}>확인 ✔</button></div>`
      : `<div class="qopts">${q.opts.map((o, j) => `<button class="${/[가-힣]/.test(o) ? '' : 'en'}" onclick="qAnswer(${j})">${esc(o)}</button>`).join('')}</div>`}
    <div class="qfb" id="qFb"></div></div>`;
}
function qPick(j) { const q = T.cur; q.built.push(q.chips[j]); renderQuiz(); }
function qUnpick(j) { T.cur.built.splice(j, 1); renderQuiz(); }
function qCheckOrder() { const q = T.cur; qResult(q.built.map(c => c.w).join(' ') === q.a, null); }
function qAnswer(j) { const q = T.cur; qResult(q.opts[j] === q.a, j); }
async function qResult(ok, j) {
  if (Date.now() < T.lock || solveState(T.R) !== 'running') return;
  const q = T.cur, btns = document.querySelectorAll('#quizBox .qopts button, #quizBox .qact button, #quizBox .qchips button');
  btns.forEach(b => b.disabled = true);
  const fb = $('#qFb');
  if (ok) {
    T.streak++;
    let pts = q.pts; const bonus = T.streak % 5 === 0 ? 2 : 0; pts += bonus;
    if (j != null) btns[j].classList.add('right');
    fb.className = 'qfb ok'; fb.innerHTML = `<img class="fbimg" src="assets/ui2/badge_ok.webp" alt="정답"> 크레딧 +${pts}${bonus ? ' (🔥 5연속 보너스!)' : ''}`;
    sfx.truth();
    DB.txn(ROOT + T.code + '/ps/' + T.key + '/credits', c => (c || 0) + pts);
    DB.txn(ROOT + T.code + '/members/' + T.key + '/score', s => (s || 0) + 1);
    T.lock = Date.now() + 700;
    setTimeout(() => { T.cur = nextQ(); renderQuiz(); }, 700);
  } else {
    T.streak = 0;
    if (j != null) { btns[j].classList.add('wrong'); const k = T.cur.opts.indexOf(q.a); btns[k] && btns[k].classList.add('right'); }
    fb.className = 'qfb no'; fb.innerHTML = `<img class="fbimg" src="assets/ui2/badge_ng.webp" alt="오답"> 정답: <span class="en">${esc(q.a)}</span><br><small>3초 뒤 다음 문제</small>`;
    sfx.bad();
    T.lock = Date.now() + 3000;
    setTimeout(() => { T.cur = nextQ(); renderQuiz(); }, 3000);
  }
}

/* ---------- 증거 사기 ---------- */
function tabPick(id) {
  if (canSee(id)) { sfx.open(); showEv(id); return; }
  const R = T.R, price = priceFor(R, T.key), cred = psOf(R, T.key).credits || 0;
  if (cred < price) { toast(`크레딧이 부족해요! (필요 ${price}, 내 크레딧 ${cred})`); sfx.bad(); return; }
  modal(`<div style="text-align:center"><div style="font-size:3rem"><i class="coin"></i></div><h2 class="title-font" style="margin:.3rem 0">이 증거를 살까요?</h2>
    <div style="color:var(--dim);font-size:1.15rem">가격 <b style="color:var(--tape)">${price}</b> 크레딧 · 내 크레딧 ${cred} → ${cred - price}</div>
    <div style="color:var(--dim);margin-top:.3rem">산 다음에는 다음 증거가 조금 더 비싸져요.</div>
    <div style="margin-top:1.2rem;display:flex;gap:.6rem;justify-content:center"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn y" onclick="tabBuy('${id}')">사기!</button></div></div>`);
}
async function tabBuy(id) {
  const R = T.R;
  const res = await DB.txn(ROOT + T.code + '/ps/' + T.key, cur => {
    cur = cur || {}; cur.opened = cur.opened || {};
    if (cur.opened[id]) return cur;
    const price = priceFor(R, T.key, Object.keys(cur.opened).length);
    if ((cur.credits || 0) < price) return undefined;
    cur.credits = (cur.credits || 0) - price; cur.opened[id] = { t: Date.now(), by: T.name };
    return cur;
  });
  if (!res) { closeModal(); toast('크레딧이 부족해요!'); return; }
  T.R.ps = T.R.ps || {}; T.R.ps[T.key] = res;
  sfx.lock(); showEv(id); tabRender();
}
function tabMine() {
  const ids = Object.keys(myOpened());
  modal(`<h2 class="title-font" style="margin-top:0">🗂 내가 산 증거</h2>
    <div class="glist big">${ids.map(id => { const e = findEv(id); const by = myOpened()[id].by; return e ? `<button onclick="showEv('${id}')">${e.icon || '📄'} ${esc(e.title)} <small>· ${esc(e.where)}${by ? ' · ' + esc(by) : ''}</small></button>` : ''; }).join('') || '<span class="none">아직 산 증거가 없어요.</span>'}</div>`);
}
function tabVote() {
  const n = note.get();
  if (!n.pick) { toast('범인을 먼저 골라 주세요!'); return; }
  const why = ($('#whyIn').value || '').trim();
  DB.update(ROOT + T.code, { ['votes/' + T.key]: { sus: n.pick, why: why ? 'Because ' + why : '', t: DB.now() } });
  sfx.drum(); toast('✔ 제출했어요!');
}
