function textOf(e) {
  const nl = s => esc(s || '').replace(/\n/g, '<br>');
  if (!e) return '';
  if (e.type === 'table') return `${e.head ? `<div class="th2">${esc(e.head)}</div>` : ''}<table class="t2"><tr>${e.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${e.rows.map(r => `<tr>${(r.c || r).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${e.foot ? `<div class="ft2">${nl(e.foot)}</div>` : ''}`;
  if (e.type === 'chat') return `${e.head ? `<div class="th2">💬 ${esc(e.head)}</div>` : ''}${e.msgs.map(([w, m]) => `<div class="cl"><b>${esc(w)}</b>${esc(m)}</div>`).join('')}`;
  if (e.type === 'calendar') return `<div class="th2">${esc(e.head)}</div>${Object.entries(e.marks || {}).map(([d, m]) => `<div class="cl"><b>${esc(e.head.slice(0, 3))} ${d}</b>${esc(m)}</div>`).join('')}${e.foot ? `<div class="ft2">${nl(e.foot)}</div>` : ''}`;
  if (e.type === 'map') return `<div class="mini">${renderEv(e)}</div>`;
  if (e.type === 'diary') return `${e.date ? `<div class="th2">${esc(e.date)}</div>` : ''}${nl(e.text)}`;
  if (e.type === 'sign' || e.type === 'poster') return `${e.head ? `<div class="th2">${esc(e.head)}</div>` : ''}${nl(e.text)}`;
  return `${nl(e.text)}${e.from ? `<div class="ft2">${esc(e.from)}</div>` : ''}`;
}
showEv = function (id, banner) {
  const e = findEv(id);
  const isLock = e.type === 'lock', open = isLock && state.unlockedLocks[e.id];
  const speak = speakText(e);
  const im = (open && e.imgOpen) || e.img;
  let right;
  if (isLock && !open) right = `<div class="etext">${textOf(e)}</div>

        ${e.ximg ? `<button class="btn sm" onclick="zoomImg('${e.ximg}')">🔍 원문 크게 보기</button>` : ''}</div>
      <div class="evright">

        ${right}
        <div class="evtools">
          ${speak ? `<button class="btn" onclick="say(decodeURIComponent('${encodeURIComponent(speak).replace(/'/g, '%27')}'))">🔊 영어로 듣기</button>` : ''}
          ${e.words && e.words.length ? `<button class="btn" onclick="document.getElementById('evWords').classList.toggle('hidden')">📘 단어 도움</button>` : ''}
          ${e.ko ? `<button class="btn" onclick="document.getElementById('evKo').classList.toggle('hidden')">🇰🇷 해석 보기</button>` : ''}
          ${window.ROLE === 'tablet' ? `<button class="btn y" onclick="tabPresent('${id}')">📺 TV에 보여 주기</button>` : ''}
        </div>
        <div class="words hidden" id="evWords">${(e.words || []).map(([a, b]) => `<span><b>${esc(a)}</b>${esc(b)}</span>`).join('')}</div>
        <div class="kotrans hidden" id="evKo">${esc(e.ko || '')}</div>
      </div>
    </div>`);
  const mb = document.querySelector('#modalRoot .mbox'); mb && mb.classList.add('evmodal');
  if (isLock && !open) setTimeout(() => { const i = $('#lockIn'); i && i.focus(); }, 50);
  fitPanel();
};
function capOf(e) {
  if (e.cap) return e.cap;
  if (e.type === 'table' && e.head) return e.head;
  const d = document.createElement('div'); d.innerHTML = textOf(e).replace(/<br\s*\/?>/g, ' ').replace(/<\/(div|tr|th|td)>/g, ' $&');
  const t = d.textContent.replace(/\s+/g, ' ').trim();
  const m = t.match(/^.{12,90}?[.!?](?=\s|"|$)"?/); return m ? m[0] : (t.length > 80 ? t.slice(0, 78) + '…' : t);
}
function fitPanel() {
  const p = document.querySelector('#modalRoot .cpanel'), im = p && p.parentNode.querySelector('img'); if (!p) return;
  const go = () => { let f = Math.max(10, im.clientHeight * 0.042); p.style.fontSize = f + 'px'; while (p.scrollHeight > p.clientHeight + 1 && f > 9) { f -= 1; p.style.fontSize = f + 'px'; } };
  im.complete ? go() : im.addEventListener('load', go, { once: true });
}
function zoomImg(src) {
  const d = document.createElement('div'); d.className = 'zoom'; d.innerHTML = `<img src="${src}" alt="">`;

}

CASES.forEach(c => (PLACE_ICON[c.unit] || []).forEach((k, i) => { if (k && c.places[i]) c.places[i].iconImg = A_BASE + 'ui/pl_' + k + '.webp'; }));
function picon(p) { return p.iconImg ? `<img class="picon" src="${p.iconImg}" alt="" draggable="false">` : `<span class="ic">${p.icon}</span>`; }
ldJudge = (function (orig) {
  return function (truth) {
    const m = document.querySelector('#stage .machine'); if (m) { m.classList.add('wob'); setTimeout(() => { const m2 = document.querySelector('#stage .machine'); m2 && m2.classList.remove('wob'); }, 1450); }
    return orig(truth);
  };
})(ldJudge);

/* ---------- 학생 입장 화면 ---------- */
askJoin = function () {
  const last = lastJoin();
  const code = (last && last.code) || '';
  closeModal();
  document.querySelectorAll('#joinScreen').forEach(x => x.remove());
  const d = document.createElement('div'); d.id = 'joinScreen';
  d.innerHTML = `<div class="stage169" style="--ar:1382/816">
    <img src="${A_BASE}ui/join.webp" alt="" draggable="false">
    <input type="hidden" id="codeIn" value="${code}">
    ${[0, 1, 2, 3].map(k => `<input class="cbox" data-k="${k}" maxlength="1" autocomplete="off" value="${code[k] || ''}" style="left:${(584 + k * 98 - 22) / 13.82}%;top:${306 / 8.16}%;width:${72 / 13.82}%;height:${62 / 8.16}%">`).join('')}
    <select id="numIn" style="left:${(586 - 22) / 13.82}%;top:${398 / 8.16}%;width:${374 / 13.82}%;height:${58 / 8.16}%"><option value="">1~32번 중 선택</option>${[...Array(32)].map((_, i) => `<option value="${i + 1}" ${last && last.num === i + 1 ? 'selected' : ''}>${i + 1}번</option>`).join('')}</select>
    <input id="nameIn" maxlength="8" placeholder="이름 입력" autocomplete="off" value="${last ? esc(last.name) : ''}" style="left:${(586 - 22) / 13.82}%;top:${478 / 8.16}%;width:${374 / 13.82}%;height:${60 / 8.16}%">
    <button class="hot" style="left:${(494 - 22) / 13.82}%;top:${560 / 8.16}%;width:${442 / 13.82}%;height:${92 / 8.16}%" onclick="doJoin()" aria-label="입장하기"></button>
    <div id="joinMsg" style="left:20%;top:81.5%;width:60%"></div>
    <button class="jback" onclick="document.getElementById('joinScreen').remove()">← 처음으로</button>
    <div class="jmode">${modeBadge()}</div>
  </div>`;
  document.body.appendChild(d);
  const boxes = [...d.querySelectorAll('.cbox')];
  const sync = () => { $('#codeIn').value = boxes.map(b => b.value.toUpperCase()).join(''); };
  boxes.forEach((b, k) => {
    b.addEventListener('input', () => { b.value = b.value.replace(/[^0-9a-z]/gi, '').toUpperCase().slice(-1); sync(); if (b.value && boxes[k + 1]) boxes[k + 1].focus(); });
    b.addEventListener('keydown', ev => { if (ev.key === 'Backspace' && !b.value && boxes[k - 1]) { boxes[k - 1].focus(); boxes[k - 1].value = ''; sync(); } if (ev.key === 'Enter') doJoin(); });
    b.addEventListener('paste', ev => { const t = (ev.clipboardData.getData('text') || '').replace(/[^0-9a-z]/gi, '').toUpperCase(); if (t) { ev.preventDefault(); boxes.forEach((x, j) => x.value = t[j] || ''); sync(); } });
  });
  d.querySelector('#nameIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') doJoin(); });
  setTimeout(() => (code.length === 4 ? d.querySelector('#nameIn') : boxes[0]).focus(), 50);
};
doJoin = (function (orig) {
  return async function () {
    const js = document.getElementById('joinScreen');
    if (js) { const bx = [...js.querySelectorAll('.cbox')]; const ci = js.querySelector('#codeIn'); if (ci && bx.length) ci.value = bx.map(b => (b.value || '').toUpperCase()).join(''); }
    if (!$('#numIn').value) { $('#joinMsg').textContent = '번호를 골라 주세요.'; return; }
    await orig();
    if (window.ROLE === 'tablet') { const j = $('#joinScreen'); j && j.remove(); }
  };
})(doJoin);
tabLeave = (function (orig) { return function () { orig(); showHomeMode(); }; })(tabLeave);

/* ---------- 학생 기기: 증거 썸네일 ---------- */
drawBoard = (function (orig) {
  return function () {
    orig();
    document.querySelectorAll('#boardBox .ev.open').forEach(b => {
      const id = (b.getAttribute('onclick') || '').match(/'([^']+)'/); if (!id) return;
      const e = findEv(id[1]); if (!e || !e.img) return;
      const q = b.querySelector('.q'); if (q) q.outerHTML = `<span class="thumb" style="background-image:url('${e.img}')"></span>`;
    });

})(drawBoard);
tabRender = (function (orig) {
  return function (force) {
    if (C) setScreenBg();
    const r = orig(force);
    if (C && !RIBBONLESS[C.unit]) document.querySelectorAll('#tab .tsc').forEach(el => { if (el.querySelector('.pimg')) { const sm = el.querySelector('small'); if (sm && sm.textContent !== '범인!') sm.remove(); } });
    return r;
  };
})(tabRender);

showHomeMode();

/* ---------- 용의자 카드: 카드 그림 + 알파벳 ---------- */
function cardHTML(s, opt = {}) {
  const k = s.card; if (!k) return avatar(s.look, { cls: 'av' });
  const L = 'ABCD'[C.suspects.indexOf(s)];
  const letter = k.lx != null ? `<b class="clet" style="left:${k.lx * 100}%;top:${k.ly * 100}%;width:${k.lw * 100}%;height:${k.lh * 100}%;font-size:calc(var(--cw) * ${k.lh * 0.8 / k.ar})">${L}</b>` : '';
  const ali = opt.alibi ? `<div class="cali" style="top:${k.ay * 100}%">${opt.alibi}</div>` : '';
  return `<div class="scard" style="aspect-ratio:${k.ar};--ar:${k.ar}"><img src="${k.img}" alt="${esc(s.name)}" draggable="false">${letter}${ali}${opt.stamp || ''}</div>`;
}
function fitCards() { document.querySelectorAll('.scard').forEach(el => el.style.setProperty('--cw', el.clientWidth + 'px')); }
window.addEventListener('resize', fitCards);
susCard = function (s, extra = '') {
  return `<div class="sus sus3" data-id="${s.id}" onclick="openSuspect('${s.id}')">${cardHTML(s)}${RIBBONLESS[C.unit] ? `<div class="nk">${esc(s.nick)}</div>` : ''}${extra}</div>`;
};
rSuspects = (function (orig) { return function () { orig(); document.querySelectorAll('#stage .saylab').forEach(e => e.remove()); document.querySelectorAll('#stage .sus .say').forEach(el => el.insertAdjacentHTML('beforebegin', '<div class="saylab">영어 자기소개</div>')); fitCards(); }; })(rSuspects);
rAlibi = function () {
  $('#stage').innerHTML = `
  <div class="sec-title"><span class="num">3</span>알리바이</div>
  <p class="sec-sub">탐정이 영어로 물어보면, 용의자는 롤카드의 알리바이를 영어로 대답해요. 대답이 끝나면 카드를 눌러 알리바이 칸에 띄우세요. (한 번 더: 한국어 뜻, 또 한 번: 숨기기)</p>
  <div class="qcards" style="margin:0 0 1rem">${C.alibiQ.map(([e, k]) => `<div class="qcard">${spk(e)}<div><div class="e">${esc(e)}</div><div class="k">${esc(k)}</div></div></div>`).join('')}</div>
  <div class="sus-grid" style="--ch:60vh">${C.suspects.map(s => {
    const sh = state.aliShown[s.id] || 0;
    const ali = sh ? `<div class="ae">${esc(s.alibiEn)}</div>${sh === 2 ? `<div class="ak">${esc(s.alibiKo)}</div>` : ''}<span class="as" onclick="event.stopPropagation();say(decodeURIComponent('${encodeURIComponent(s.alibiEn).replace(/'/g, '%27')}'))">🔊</span>` : `<div class="aq">❓ 알리바이 듣기</div>`;
    return `<div class="sus sus3" onclick="state.aliShown['${s.id}']=((state.aliShown['${s.id}']||0)+1)%3;rAlibi()">${cardHTML(s, { alibi: ali })}</div>`;
  }).join('')}</div>`;
  fitCards();
};
rVote = (function (orig) {
  return function () {
    orig();
    document.querySelectorAll('#stage .sus').forEach((el, i) => {
      const s = C.suspects[i]; if (!s || !s.card) return;
      el.querySelectorAll('.slabel,.nm,.nk,.pimg,svg.av').forEach(x => x.remove());
      el.classList.add('sus3'); el.insertAdjacentHTML('afterbegin', cardHTML(s));
    });
    const g = document.querySelector('#stage .sus-grid'); if (g) g.style.setProperty('--ch', '50vh');
    fitCards();
  };
})(rVote);
openSuspect = function (id) {
  const s = C.suspects.find(x => x.id === id);
  modal(`<div style="display:grid;grid-template-columns:20rem 1fr;gap:1.4rem;align-items:center">
      <div>${cardHTML(s)}</div>
      <div>
        <div class="expr">${spk(s.introEn)}<div class="e" style="font-size:1.8rem">${esc(s.introEn)}</div></div>
        <div style="color:var(--dim);margin:.2rem 0 1rem 2.7rem">${esc(s.introKo)}</div>
        <div class="expr">${spk(s.lookEn)}<div class="e" style="font-size:1.5rem">${esc(s.lookEn)}</div></div>
        <div style="color:var(--dim);margin:.2rem 0 1rem 2.7rem">${esc(s.lookKo)}</div>
        <div style="background:#ffffff0a;border-radius:.8rem;padding:.8rem 1rem;line-height:1.7">${s.profile.map(esc).join('<br>')}</div>
      </div></div>`);
  fitCards();
};
rReveal = (function (orig) {
  return function () {
    orig();
    if (state.revealed) {
      const culp = C.suspects.find(s => s.culprit), cc = $('#ccard');
      if (cc && culp.card) { const st = cc.querySelector('.stampc'); cc.querySelectorAll('.pimg,svg,.nm').forEach(x => x.remove()); cc.insertAdjacentHTML('afterbegin', cardHTML(culp)); if (st) cc.appendChild(st); }
    }
    fitCards();
  };
})(rReveal);
drumRoll = (function (orig) { return function () { fitCards(); orig(); }; })(drumRoll);
tabRender = (function (orig) {
  return function (force) {
    const r = orig(force);
    if (C) document.querySelectorAll('#tab .tsc').forEach(el => {
      const id = (el.getAttribute('onclick') || '').match(/'pick','([a-d])'/); let s = id ? C.suspects.find(x => x.id === id[1]) : null;
      if (!s) { const nm = el.querySelector('b'); s = nm && C.suspects.find(x => x.name === nm.textContent); }
      if (!s || !s.card || el.querySelector('.scard')) return;
      const sm = el.querySelector('small'), isC = sm && sm.textContent === '범인!';
      el.querySelectorAll('.pimg,svg,b,small').forEach(x => x.remove());
      el.insertAdjacentHTML('afterbegin', cardHTML(s));
      if (isC) el.insertAdjacentHTML('beforeend', '<small class="cbadge2">범인!</small>');
    });
    fitCards();
    return r;
  };
})(tabRender);

/* ---------- "▼ 아래로 더 있어요" 표시 ---------- */
(function () {
  const SEL = ['#case .stage', '#tab .tabbody'];
  const hints = {};
  function hintFor(sel) {
    if (!hints[sel]) {
      const h = document.createElement('button'); h.className = 'morehint'; h.type = 'button';
      h.innerHTML = '▼ 아래로 더 있어요';
      h.addEventListener('click', () => { const el = document.querySelector(sel); if (el) el.scrollBy({ top: el.clientHeight * .7, behavior: 'smooth' }); });
      document.body.appendChild(h); hints[sel] = h;
    }
    return hints[sel];
  }
  function update() {
    SEL.forEach(sel => {
      const el = document.querySelector(sel), h = hintFor(sel);
      const vis = el && el.offsetParent !== null && !el.closest('.hidden') && el.getBoundingClientRect().height > 0;
      const more = vis && (el.scrollHeight - el.scrollTop - el.clientHeight > 24);
      const modal = document.querySelector('#modalRoot .modal');
      if (!more || modal) { h.classList.remove('on'); return; }
      const r = el.getBoundingClientRect();
      h.style.left = (r.left + r.width / 2) + 'px';
      h.style.top = (r.bottom - 8) + 'px';
      h.classList.add('on');
    });
  }
  window.updateMoreHints = update;
  document.addEventListener('scroll', update, true);
  window.addEventListener('resize', update);
  new MutationObserver(() => requestAnimationFrame(update)).observe(document.body, { childList: true, subtree: true });
  setInterval(update, 1200);
})();

</script>
